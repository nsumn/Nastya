    <style>
      :root {
        --ink: #33241e;
        --cap: #ffffff;
        --font-display: "Nunito", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .art { position: absolute; inset: 0; width: 1080px; height: 1920px; transform-origin: 50% 55%; }
      .cap {
        position: absolute; left: 90px; right: 90px; top: 1360px;
        text-align: center; color: var(--cap); font-weight: 900; font-size: 64px; line-height: 1.05;
        text-transform: uppercase; letter-spacing: 0.5px;
        -webkit-text-stroke: 14px #24180f; paint-order: stroke fill;
        text-shadow: 0 6px 0 rgba(0,0,0,.35);
      }
      .cap b { color: #ffd54a; }
      .hud { position: absolute; right: 40px; top: 190px; width: 420px; height: 300px; }
      .big {
        position: absolute; left: 0; right: 0; text-align: center; font-weight: 900;
        -webkit-text-stroke: 18px #24180f; paint-order: stroke fill; text-transform: uppercase;
      }
    </style>
  </head>
