<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roblox Halloween</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --ink:#0b0b0f; --grey:#8a8a93; --soft:#f2f1f6; --card:#e6e5ec; --line:#dcdbe3;
    --red:#e5484d; --btn:#0b0b0f; --btn-tx:#fff;
    --sky1:#120c24; --sky2:#2a1a33; --acc1:#ff8a00; --acc2:#8b3fd9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    font:15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
         Helvetica, Arial, sans-serif;
    color:var(--ink); background:var(--soft); overflow-x:hidden;
  }
  [data-t]{white-space:pre-line}
  .screen{display:none; min-height:100vh; min-height:100dvh}
  .screen.on{display:block; animation:fade .35s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ---------- 1. ночная улица ---------- */
  #s-nick{position:relative; overflow:hidden; color:#fff;
    background:linear-gradient(180deg,var(--sky1) 0%,#2a1d4a 38%,#3a2752 60%,var(--sky2) 100%);
    background-size:cover; background-position:center}
  #s-nick.pic .sky{display:none}
  .sky{position:absolute; inset:0; pointer-events:none}
  .star{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
        opacity:.7; animation:tw 3s ease-in-out infinite}
  @keyframes tw{50%{opacity:.15}}
  .moon{position:absolute; left:50%; top:24%; width:64px; height:64px; margin-left:-32px;
    border-radius:50%;
    background:radial-gradient(circle at 40% 38%,#fffdf4 0%,#e9e5d6 55%,#c9c4b3 100%);
    box-shadow:0 0 40px 14px rgba(255,248,220,.28), 0 0 120px 40px rgba(170,150,255,.18)}
  .bat{position:absolute; font-size:14px; filter:brightness(.25);
       animation:fly 7s ease-in-out infinite}
  @keyframes fly{50%{transform:translate(14px,-8px) rotate(6deg)}}
  .town{position:absolute; left:0; right:0; bottom:0; height:62%}
  .town svg{position:absolute; bottom:0; width:100%; height:100%}
  .pumpkin{position:absolute; bottom:15%; font-size:26px;
    filter:drop-shadow(0 0 10px rgba(255,140,0,.9))}

  .brand{position:relative; z-index:2; text-align:center; padding-top:22px}
  .brand .rb{font-weight:900; font-size:30px; letter-spacing:1px; line-height:1}
  .brand .hw{font-size:12px; letter-spacing:4px; margin-top:6px; opacity:.9}

  .nick-card{position:relative; z-index:2; margin:22vh 14px 0; background:#fff;
    color:var(--ink); border-radius:18px; padding:20px 18px 18px;
    box-shadow:0 20px 50px rgba(0,0,0,.35); transition:margin .3s}
  body.kb .nick-card{margin-top:14px}
  .nick-card h3{margin:0 0 6px; font-size:19px; font-weight:800}
  .nick-card .sub{margin:0 0 14px; font-size:12px; color:#6b6b74}
  .field{display:flex; align-items:center; gap:8px; background:var(--soft);
    border:1.5px solid transparent; border-radius:12px; padding:0 14px; height:46px}
  .field:focus-within{background:#fff; border-color:var(--ink)}
  .field span{color:#a3a3ad}
  .field input{flex:1; border:0; outline:0; background:transparent; font:inherit;
    font-size:15px; font-weight:600; color:var(--ink); min-width:0}
  .found{display:none; align-items:center; gap:12px; margin-top:14px}
  .found.on{display:flex}
  .found img{width:46px; height:46px; border-radius:50%; background:var(--soft);
    object-fit:cover}
  .found b{font-size:16px}
  .err{display:none; color:var(--red); font-size:13px; font-weight:600; margin-top:10px;
       text-align:center}
  .err.on{display:block}

  .dock{position:fixed; left:0; right:0; bottom:0; padding:12px 14px 18px; z-index:5}
  .btn{width:100%; height:48px; border:0; border-radius:12px; cursor:pointer;
    font:inherit; font-size:15px; font-weight:700; background:var(--btn); color:var(--btn-tx);
    display:flex; align-items:center; justify-content:center; gap:8px}
  .btn:active{transform:scale(.985)}
  .btn.ghost{background:rgba(255,255,255,.14); color:rgba(255,255,255,.75);
             backdrop-filter:blur(8px)}
  .btn.white{background:#fff; color:var(--ink)}
  .btn.outline{background:#fff; color:var(--ink); border:1.5px solid var(--line)}
  .btn.busy{background:#b8b7c0}
  .btn:disabled{cursor:default}
  .spin{width:16px; height:16px; border-radius:50%; border:2px solid currentColor;
        border-right-color:transparent; animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- светлые экраны ---------- */
  .top{text-align:center; font-weight:700; font-size:16px; padding:18px 0 14px}
  .pad{padding:0 14px 120px}
  .choice{background:var(--card); border-radius:18px; padding:0 12px 12px;
    text-align:center; margin:44px 0 18px}
  .choice .pic{font-size:74px; line-height:1; margin-top:-34px; height:92px;
    display:flex; align-items:flex-end; justify-content:center}
  .pic img{max-height:92px; max-width:140px; object-fit:contain}
  .choice.trick .pic{filter:drop-shadow(0 6px 10px rgba(80,200,60,.45))}
  .choice.sweet .pic{filter:drop-shadow(0 6px 10px rgba(255,120,200,.4))}
  .choice h4{margin:10px 0 4px; font-size:19px; font-weight:800}
  .choice p{margin:0 0 12px; font-size:11px; color:#55545c}
  .confirm-h{text-align:center; margin:60px 0 0}
  .confirm-h h3{margin:0 0 4px; font-size:19px}
  .confirm-h p{margin:0; font-size:11px; color:#55545c}

  /* всплывающее окно */
  .veil{position:fixed; inset:0; background:rgba(20,18,30,.55); z-index:10;
        display:none; align-items:center; justify-content:center; padding:24px}
  .veil.on{display:flex; animation:fade .25s}
  .pop{background:#fff; border-radius:18px; width:100%; max-width:300px;
       padding:20px 14px 14px; text-align:center; animation:up .35s ease-out}
  @keyframes up{from{transform:scale(.9); opacity:0}to{transform:none; opacity:1}}
  .pop h3{margin:0; font-size:17px}
  .pop .lead{margin:2px 0 10px; font-size:13px; color:#55545c}
  .prize{display:flex; align-items:center; justify-content:center; gap:10px;
         font-size:34px; font-weight:800; font-variant-numeric:tabular-nums}
  .pop .acc{font-size:11px; color:#55545c; margin:2px 0 8px}
  .pop .fine{font-size:11px; color:#6b6b74; background:var(--soft); border-radius:10px;
             padding:8px 10px; margin-bottom:12px}

  /* подписки */
  .sum{display:flex; align-items:center; gap:12px; background:#fff; border-radius:14px;
       padding:12px 14px; margin-bottom:16px}
  .sum .lbl{font-size:10px; color:var(--grey)}
  .sum .val{font-size:16px; font-weight:800}
  .sum .r{margin-left:auto; text-align:right}
  .step h3{margin:0 0 4px; font-size:18px}
  .step p{margin:0 0 12px; font-size:11px; color:#55545c}
  .bar{display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:11px;
       font-weight:700}
  .bar .t{flex:1; height:5px; border-radius:3px; background:var(--line); overflow:hidden}
  .bar .f{height:100%; width:0; background:var(--btn); transition:width .3s}
  .row{display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px;
       padding:10px 10px 10px 12px; margin-bottom:8px}
  .row .av{width:34px; height:34px; flex:none; border-radius:50%; color:#fff;
    font-weight:800; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#f2546b,#8b3fd9)}
  .row .tx{flex:1; min-width:0}
  .row .n{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden;
          text-overflow:ellipsis}
  .row .s{font-size:10px; color:var(--grey)}
  .row button{border:0; border-radius:8px; background:var(--btn); color:var(--btn-tx);
    font:inherit; font-size:11px; font-weight:700; padding:8px 10px; cursor:pointer}
  .row.done button{background:var(--soft); color:var(--ink)}
  .dock.light{background:linear-gradient(180deg,rgba(242,241,246,0),var(--soft) 30%)}
  .cap{text-align:center; font-size:11px; color:var(--grey); margin-top:8px}
  .cap.bad{color:var(--red)}

  /* итог: таймер */
  .ticket{background:#fff; border-radius:18px; padding:22px 16px; text-align:center;
          margin-top:10px; position:relative; overflow:hidden}
  .ticket:before{content:""; position:absolute; inset:0 0 auto 0; height:6px;
    background:linear-gradient(90deg,var(--acc1),var(--acc2))}
  .ticket img{width:72px; height:72px; border-radius:50%; background:var(--soft);
              object-fit:cover; margin:4px 0 4px}
  .ticket .who{font-weight:800; font-size:16px; margin-bottom:8px}
  .ticket .wait{font-size:12px; color:var(--grey); margin-top:16px}
  .clock{display:flex; justify-content:center; gap:6px; margin-top:6px}
  .clock div{min-width:64px; background:var(--soft); border-radius:12px; padding:8px 4px 6px}
  .clock b{display:block; font-size:30px; font-weight:900; line-height:1.1;
           font-variant-numeric:tabular-nums}
  .clock span{font-size:10px; color:var(--grey)}
  .clock i{align-self:center; font-style:normal; font-size:24px; font-weight:900;
           color:var(--grey); margin-top:-14px}
  .ticket .fine{font-size:12px; color:#55545c; background:var(--soft); border-radius:10px;
                padding:10px; margin-top:14px}
  .ticket.ready .clock b{color:#2f9e44}
  .note{background:#fff; border-radius:14px; padding:14px; margin-top:12px;
        font-size:14px; white-space:pre-line}

  /* ---------- режим редактирования (видит только администратор) ---------- */
  #ed-fab{position:fixed; top:10px; right:10px; z-index:30; display:none;
    width:38px; height:38px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(255,255,255,.92); box-shadow:0 4px 14px rgba(0,0,0,.25); font-size:18px}
  body.admin #ed-fab{display:block}
  body.edit #ed-fab{display:none}
  #ed-bar{position:fixed; top:0; left:0; right:0; z-index:40; display:none;
    background:#111018; color:#fff; padding:8px 10px 10px; font-size:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.3)}
  body.edit #ed-bar{display:block}
  body.edit{padding-top:96px}
  body.edit .screen{min-height:calc(100dvh - 96px)}
  .ed-row{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none}
  .ed-row::-webkit-scrollbar{display:none}
  .ed-row + .ed-row{margin-top:8px}
  .ed-chip{flex:none; border:0; border-radius:999px; padding:7px 11px; cursor:pointer;
    font:inherit; font-size:12px; font-weight:600; background:#2a2833; color:#fff}
  .ed-chip.on{background:#fff; color:#111}
  .ed-chip.save{background:#2f9e44}
  .ed-chip.save.dirty{background:#f08c00}
  .ed-hint{opacity:.6; margin:0 0 6px}
  body.edit [data-t]{outline:1.5px dashed rgba(240,140,0,.9); outline-offset:2px;
    border-radius:4px; cursor:text}
  body.edit [data-t]:empty{display:inline-block; min-width:40px; min-height:14px}
  #ed-sheet{position:fixed; inset:0; z-index:50; display:none;
    background:rgba(10,10,15,.5); align-items:flex-end}
  #ed-sheet.on{display:flex}
  .ed-box{background:#fff; width:100%; max-height:86vh; overflow:auto;
    border-radius:18px 18px 0 0; padding:16px 14px 20px; animation:slide .25s ease-out}
  @keyframes slide{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
  .ed-box h4{margin:0 0 4px; font-size:16px}
  .ed-box .ed-sub{font-size:11px; color:var(--grey); margin-bottom:10px}
  .ed-box textarea, .ed-box input[type=text], .ed-box input[type=number]{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px;
    font:inherit; font-size:15px; resize:vertical; color:#111; background:#fff}
  .ed-box textarea{min-height:80px}
  .ed-box input[type=color]{width:56px; height:36px; border:0; padding:0; background:none}
  .ed-btns{display:flex; gap:8px; margin-top:12px}
  .ed-btns .btn{height:44px; font-size:14px; background:#0b0b0f; color:#fff}
  .ed-btns .btn.outline{background:#fff; color:#0b0b0f}
  .ed-group{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
    color:var(--grey); margin:18px 0 8px}
  .ed-item{margin-bottom:10px}
  .ed-item label{display:block; font-size:12px; font-weight:600; margin-bottom:4px}
  .ed-item textarea{min-height:44px}
  .ed-line{display:flex; align-items:center; gap:10px}
  .ed-line input[type=text]{flex:1}
  .ed-reset{border:0; background:none; color:var(--grey); font:inherit; font-size:11px;
    cursor:pointer; padding:2px 0; text-decoration:underline}
  #ed-toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:60;
    background:#111018; color:#fff; border-radius:10px; padding:10px 14px; font-size:13px;
    display:none}
  #ed-toast.on{display:block; animation:fade .2s}
</style>
</head>
<body>

<!-- 1. ник -->
<section id="s-nick" class="screen on">
  <div class="sky" id="sky">
    <div class="moon"></div>
    <div class="bat" style="left:18%;top:30%">🦇</div>
    <div class="bat" style="left:72%;top:22%;animation-delay:-2s">🦇</div>
    <div class="bat" style="left:62%;top:36%;font-size:10px;animation-delay:-4s">🦇</div>
    <div class="town">
      <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3c2a4e"/><stop offset="1" stop-color="#1c1224"/>
          </linearGradient>
        </defs>
        <path d="M0 120 L30 95 L60 120 L60 300 L0 300Z" fill="#1d1430"/>
        <path d="M50 140 L85 100 L120 140 L120 300 L50 300Z" fill="#241839"/>
        <path d="M280 140 L315 102 L350 140 L350 300 L280 300Z" fill="#241839"/>
        <path d="M340 115 L372 88 L400 112 L400 300 L340 300Z" fill="#1d1430"/>
        <rect x="18" y="140" width="10" height="14" fill="#ffb347" opacity=".85"/>
        <rect x="80" y="160" width="10" height="14" fill="#ffb347" opacity=".75"/>
        <rect x="300" y="158" width="10" height="14" fill="#ffb347" opacity=".8"/>
        <rect x="362" y="135" width="10" height="14" fill="#ffb347" opacity=".85"/>
        <path d="M120 300 L180 170 L220 170 L280 300Z" fill="url(#road)"/>
      </svg>
      <div class="pumpkin" style="left:8%">🎃</div>
      <div class="pumpkin" style="left:24%;bottom:22%;font-size:20px">🎃</div>
      <div class="pumpkin" style="right:22%;bottom:20%;font-size:22px">🎃</div>
      <div class="pumpkin" style="right:7%">🎃</div>
    </div>
  </div>

  <div class="brand"><div class="rb" data-t="brand_top"></div><div class="hw" data-t="brand_sub"></div></div>

  <div class="nick-card">
    <h3 data-t="nick_title"></h3>
    <p class="sub" data-t="nick_sub"></p>
    <label class="field"><span>@</span>
      <input id="nick" data-t="nick_ph" data-attr="placeholder" maxlength="30"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    </label>
    <div class="found" id="found"><img id="found-img" alt=""><b id="found-name"></b></div>
    <div class="err" id="nick-err"></div>
  </div>

  <div class="dock"><button class="btn ghost" id="b-find" data-t="nick_btn"></button></div>
</section>

<!-- 2. выбор -->
<section id="s-pick" class="screen">
  <div class="top" data-t="pick_top"></div>
  <div class="pad">
    <div class="choice trick">
      <div class="pic" data-t="trick_pic"></div>
      <h4 data-t="trick_title"></h4>
      <p data-t="trick_desc"></p>
      <button class="btn" data-choice="trick" data-t="pick_btn"></button>
    </div>
    <div class="choice sweet">
      <div class="pic" data-t="sweet_pic"></div>
      <h4 data-t="sweet_title"></h4>
      <p data-t="sweet_desc"></p>
      <button class="btn" data-choice="sweet" data-t="pick_btn"></button>
    </div>
  </div>
</section>

<!-- 3. подтверждение -->
<section id="s-sure" class="screen">
  <div class="top" data-t="sure_top"></div>
  <div class="pad">
    <div class="confirm-h">
      <h3 data-t="sure_title"></h3>
      <p data-t="sure_sub"></p>
    </div>
    <div class="choice" id="sure-card">
      <div class="pic" id="sure-pic"></div>
      <h4 id="sure-title"></h4>
      <p data-t="sure_desc"></p>
      <button class="btn" id="b-sure" data-t="sure_btn"></button>
    </div>
  </div>
  <div class="dock"><button class="btn outline" id="b-cancel" data-t="sure_cancel"></button></div>
</section>

<!-- 4. подписки -->
<section id="s-subs" class="screen">
  <div class="top" data-t="subs_top"></div>
  <div class="pad">
    <div class="sum">
      <svg class="rbx" width="30" height="30" viewBox="0 0 24 24"></svg>
      <div><div class="lbl" data-t="subs_prize_lbl"></div><div class="val" id="sum-prize"></div></div>
      <div class="r"><div class="lbl" data-t="subs_acc_lbl"></div><div class="val" id="sum-acc"></div></div>
    </div>
    <div class="step">
      <h3 data-t="subs_title"></h3>
      <p data-t="subs_text"></p>
    </div>
    <div class="bar"><div class="t"><div class="f" id="bar"></div></div><span id="pct">0%</span></div>
    <div id="rows"></div>
  </div>
  <div class="dock light">
    <button class="btn" id="b-check" data-t="subs_btn"></button>
    <div class="cap" id="cap"></div>
  </div>
</section>

<!-- 5. отсчёт до зачисления -->
<section id="s-done" class="screen">
  <div class="top" data-t="done_top"></div>
  <div class="pad">
    <div class="ticket" id="ticket">
      <img id="t-img" alt="">
      <div class="who" id="t-who"></div>
      <div class="prize"><svg class="rbx" width="28" height="28" viewBox="0 0 24 24"></svg>
        <span id="t-prize"></span></div>
      <div class="wait" id="t-wait" data-t="done_wait"></div>
      <div class="clock">
        <div><b id="c-h">24</b><span data-t="done_h"></span></div><i>:</i>
        <div><b id="c-m">00</b><span data-t="done_m"></span></div><i>:</i>
        <div><b id="c-s">00</b><span data-t="done_s"></span></div>
      </div>
      <div class="fine" data-t="done_fine"></div>
    </div>
    <div class="note" id="t-note"></div>
  </div>
  <div class="dock light"><button class="btn" id="b-close" data-t="done_btn"></button></div>
</section>

<!-- всплывающее окно с робуксами -->
<div class="veil" id="veil">
  <div class="pop">
    <h3 data-t="pop_title"></h3>
    <div class="lead" data-t="pop_lead"></div>
    <div class="prize"><svg class="rbx" width="32" height="32" viewBox="0 0 24 24"></svg>
      <span id="pop-prize">0</span></div>
    <div class="acc" data-t="pop_acc"></div>
    <div class="fine" data-t="pop_fine"></div>
    <button class="btn" id="b-take" data-t="pop_btn"></button>
  </div>
</div>

<!-- редактор (только администратор) -->
<button id="ed-fab" title="Редактировать">✏️</button>
<div id="ed-bar">
  <div class="ed-hint">Режим редактирования — нажми на любой текст или картинку, чтобы изменить</div>
  <div class="ed-row" id="ed-screens"></div>
  <div class="ed-row">
    <button class="ed-chip" id="ed-all">📝 Все тексты</button>
    <button class="ed-chip" id="ed-design">🎨 Цвета и числа</button>
    <button class="ed-chip save" id="ed-save">💾 Сохранить</button>
    <button class="ed-chip" id="ed-exit">✕ Выйти</button>
  </div>
</div>
<div id="ed-sheet"><div class="ed-box" id="ed-box"></div></div>
<div id="ed-toast"></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  }
  var el = function (id) { return document.getElementById(id); };
  var SCREENS = ['s-nick', 's-pick', 's-sure', 's-subs', 's-done'];
  var st = { user: null, choice: '', data: null, opened: {}, screen: 's-nick', offset: 0 };

  // ---------- все тексты страницы: [ключ, по умолчанию, подпись, раздел] ----------
  // {acc} — ник, {prize} — сумма, {hours} — часы ожидания, {k}/{n} — открыто/всего
  var G1 = '1. Ввод ника', G2 = '2. Выбор', G3 = '3. Подтверждение', G4 = 'Окно с робуксами',
      G5 = '4. Подписки', G6 = '5. Таймер 24 часа', G7 = 'Сообщения', GC = 'Цвета и числа';
  var DEF = [

    if (st.screen === 's-done' && st.data) tick();
  }
  function isChanged(key) { return T(key) !== META[key][1]; }

  function field(key, onInput) {
    var d = META[key], kind = d[4] || 'text', wrap = document.createElement('div');
    wrap.className = 'ed-item';
    wrap.innerHTML = '<label>' + esc(d[2]) + '</label>';
    var inp;
    if (kind === 'color') {
      var line = document.createElement('div'); line.className = 'ed-line';
      inp = document.createElement('input'); inp.type = 'color';
      var txt = document.createElement('input'); txt.type = 'text'; txt.value = T(key);
      inp.value = /^#[0-9a-f]{6}$/i.test(T(key)) ? T(key) : d[1];
      inp.addEventListener('input', function () { txt.value = inp.value; onInput(inp.value); });
      txt.addEventListener('input', function () {
        if (/^#[0-9a-f]{6}$/i.test(txt.value)) inp.value = txt.value;
        onInput(txt.value.trim());
      });
      line.appendChild(inp); line.appendChild(txt); wrap.appendChild(line);
      inp = txt;
    } else {
      inp = document.createElement(kind === 'text' ? 'textarea' : 'input');
      if (kind === 'number') { inp.type = 'number'; inp.min = '0'; inp.inputMode = 'numeric'; }
      if (kind === 'url') { inp.type = 'text'; inp.placeholder = 'https://…'; }
      inp.value = T(key);
      inp.addEventListener('input', function () { onInput(inp.value); });
      wrap.appendChild(inp);
    }
    var reset = document.createElement('button');
    reset.className = 'ed-reset'; reset.textContent = 'вернуть как было';
    reset.style.display = isChanged(key) ? '' : 'none';
    reset.addEventListener('click', function () {
      setDirty(key, null); inp.value = T(key);
      if (kind === 'color') wrap.querySelector('input[type=color]').value = T(key);
      reset.style.display = 'none';
    });
    wrap.appendChild(reset);
    wrap._input = inp; wrap._reset = reset;
    return wrap;
  }
  function openSheet(build) {
    var box = el('ed-box'); box.innerHTML = ''; build(box);
    el('ed-sheet').classList.add('on');
  }
  function closeSheet() { el('ed-sheet').classList.remove('on'); }
  el('ed-sheet').addEventListener('click', function (e) { if (e.target === el('ed-sheet')) closeSheet(); });
  function closeBtn(box, label) {
    var row = document.createElement('div'); row.className = 'ed-btns';
    var ok = document.createElement('button'); ok.className = 'btn'; ok.textContent = label || 'Готово';
    ok.addEventListener('click', closeSheet); row.appendChild(ok); box.appendChild(row);
  }
  function hint(key) {
    if (META[key][4]) return '';
    return 'Можно вставить: {acc} — ник, {prize} — сумма, {hours} — часы' +
      (key === 'subs_count' ? ', {k} — открыто, {n} — всего' : '');
  }
  function editOne(key) {
    openSheet(function (box) {
      var h = document.createElement('h4'); h.textContent = META[key][2]; box.appendChild(h);
      var sub = document.createElement('div'); sub.className = 'ed-sub';
      sub.textContent = META[key][3] + (hint(key) ? ' · ' + hint(key) : '');
      box.appendChild(sub);
      var f = field(key, function (v) { setDirty(key, v); f._reset.style.display = ''; });
      f.querySelector('label').style.display = 'none';
      box.appendChild(f);
      closeBtn(box);
      setTimeout(function () { try { f._input.focus(); } catch (e) {} }, 250);
    });
  }
  function editList(filter, title) {
    openSheet(function (box) {
      var h = document.createElement('h4'); h.textContent = title; box.appendChild(h);
      var sub = document.createElement('div'); sub.className = 'ed-sub';
      sub.textContent = 'Изменения сразу видны на странице. Не забудь нажать «Сохранить».';
      box.appendChild(sub);
      var group = '';
      DEF.filter(filter).forEach(function (d) {
        if (d[3] !== group) {
          group = d[3];
          var g = document.createElement('div'); g.className = 'ed-group'; g.textContent = group;
          box.appendChild(g);
        }
        var f = field(d[0], function (v) { setDirty(d[0], v); f._reset.style.display = ''; });
        box.appendChild(f);
      });
      closeBtn(box);
    });
  }
  el('ed-all').addEventListener('click', function () {
    editList(function (d) { return d[3] !== GC; }, 'Все тексты');
  });
  el('ed-design').addEventListener('click', function () {
    editList(function (d) { return d[3] === GC; }, 'Цвета и числа');
  });
  el('ed-save').addEventListener('click', async function () {
    if (!Object.keys(dirty).length) { toast('Нечего сохранять'); return; }
    try {
      var r = await api('api/app/texts', { texts: dirty });
      if (r.status >= 400) { toast(r.data.error || 'Не сохранилось'); return; }
      TX = r.data.texts || {}; dirty = {};
      el('ed-save').classList.remove('dirty');
      paint(); haptic('success'); toast('Сохранено ✅ Все увидят изменения');
    } catch (e) { toast('Ошибка сети — не сохранилось'); }
  });
  el('ed-exit').addEventListener('click', function () {
    var leave = function () { location.reload(); };
    if (!Object.keys(dirty).length) return leave();
    var q = 'Есть несохранённые изменения. Выйти без сохранения?';
    if (tg && tg.showConfirm) tg.showConfirm(q, function (ok) { if (ok) leave(); });
    else if (window.confirm(q)) leave();
  });
  el('ed-fab').addEventListener('click', function () {
    editing = true; document.body.classList.add('edit');
    input.readOnly = true;
    preview(st.screen === 's-nick' && !el('veil').classList.contains('on') ? 's-nick' : st.screen);
  });
  // в режиме редактирования нажатие — это правка, а не действие
  document.addEventListener('click', function (e) {
    if (!editing) return;
    if (e.target.closest('#ed-bar, #ed-sheet, #ed-fab')) return;
    e.preventDefault(); e.stopPropagation();
    var n = e.target.closest('[data-t]');
    if (!n && e.target.closest('#sure-pic, #sure-title')) {
      n = { dataset: { t: (st.choice || 'trick') + (e.target.closest('#sure-pic') ? '_pic' : '_title') } };
    }
    if (n) editOne(n.dataset.t);
  }, true);

  // ---------- запуск ----------
  paint();
  (async function loadTexts() {
    try {
      var r = await api('api/app/texts');
      if (r.status < 400) {
        TX = r.data.texts || {};
        admin = !!r.data.admin;
        document.body.classList.toggle('admin', admin);
        paint();
      }
    } catch (e) {}
  })();

  // уже получил робуксы или бросил на подписках — продолжаем с того же места
  (async function resume() {
    try {
      var r = await api('api/raffle');
      if (!r.data || (r.data.status !== 'joined' && r.data.status !== 'picked')) return;
      setData(r.data);
      try {
        var u = await api('api/roblox/user?username=' + encodeURIComponent(r.data.username));
        if (u.status < 400) st.user = u.data;
      } catch (e) {}
      if (editing) return;
      if (r.data.status === 'joined') done(); else subs();
    } catch (e) {}
  })();
})();
</script>
</body>
</html>
