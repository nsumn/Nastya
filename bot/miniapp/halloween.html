<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Halloween 2026</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111114; --mute:#6e6e76; --soft:#f3f3f5; --line:#e6e6ea; --bg:#ffffff;
    --btn:#151517; --btn-tx:#ffffff; --accent:#3b5bdb; --warn:#fdf3ee; --warn-line:#f2d3c6;
    --red:#d9480f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font:15px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
       color:var(--ink); background:var(--bg); overflow-x:hidden; -webkit-font-smoothing:antialiased}
  [data-t]{white-space:pre-line}
  .chip [data-t], .stats [data-t]{white-space:nowrap}
  b{font-weight:700}
  u{text-decoration:none; background:linear-gradient(transparent 62%, #e9e9ee 62%); font-weight:700}
  button{font:inherit}
  .gray{color:#8c8c94}
  .kick{font-size:11px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase}
  h1,h2,h3{margin:0; letter-spacing:-.6px}

  /* ---------- загрузка ---------- */
  #loader{position:fixed; inset:0; z-index:40; background:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    transition:opacity .45s}
  #loader.off{opacity:0; pointer-events:none}
  .blobs{position:absolute; inset:0; overflow:hidden; pointer-events:none; filter:blur(40px)}
  .blobs i{position:absolute; width:46vw; height:46vw; border-radius:50%; opacity:.55}
  .blobs i:nth-child(1){left:-14vw; top:6vh; background:#ffe1cf}
  .blobs i:nth-child(2){right:-16vw; top:30vh; background:#ece6ff}
  .blobs i:nth-child(3){left:10vw; bottom:4vh; background:#f0f0f3}
  .rbx-sq{width:62px; height:62px; transform:rotate(-14deg); background:#151517; position:relative; border-radius:4px}
  .rbx-sq:after{content:""; position:absolute; left:50%; top:50%; width:20px; height:20px;
    margin:-10px 0 0 -10px; background:#fff}
  #loader .kick{margin-top:30px; color:#3a3a40}
  .ld-title{font-size:44px; font-weight:900; line-height:1.02; letter-spacing:-2px; margin-top:12px}
  .ld-sub{color:#55555c; margin-top:16px; font-size:15px}
  .ld-bar{width:200px; height:3px; border-radius:2px; background:#ececf0; margin-top:24px; overflow:hidden}
  .ld-bar i{display:block; height:100%; width:0; background:#151517; transition:width 1.4s ease-out}
  .ld-cap{font-size:12px; color:#7a7a82; margin-top:12px}
  #loader > *{position:relative}
  #loader .blobs{position:absolute}

  /* ---------- шапка ---------- */
  .wrap{padding:14px 14px 40px; max-width:560px; margin:0 auto}
  .head{display:flex; align-items:center; gap:10px}
  .wordmark{font-weight:900; font-size:20px; letter-spacing:.5px; display:flex; align-items:center}
  .wordmark .o{display:inline-block; width:14px; height:14px; background:var(--ink); margin:0 1px;
    transform:rotate(-14deg); position:relative; border-radius:1px}
  .wordmark .o:after{content:""; position:absolute; left:4.5px; top:4.5px; width:5px; height:5px; background:var(--bg)}
  .head .sep{width:1px; height:28px; background:var(--line)}
  .head .ev b{display:block; font-size:10.5px; font-weight:800; letter-spacing:.4px}
  .head .ev span{display:block; font-size:9px; color:var(--mute); letter-spacing:.8px; font-weight:600}
  .who{margin-left:auto; display:flex; align-items:center; gap:7px; border:0; background:none;
    font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer; padding:0; max-width:45%}
  .who span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ava{width:30px; height:30px; flex:none; border-radius:50%; background:var(--soft);
    display:flex; align-items:center; justify-content:center}
  .search{display:flex; align-items:center; gap:10px; margin-top:14px; height:44px; padding:0 10px 0 14px;
    background:var(--soft); border:1px solid var(--line); border-radius:8px}
  .search input{flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:16px; color:var(--ink)}
  .search input::placeholder{color:#7d7d85}
  .kbd{font-size:10px; color:#8a8a92; border:1px solid var(--line); border-radius:4px; padding:1px 4px; background:#fff}
  .hr{height:1px; background:var(--line); margin:12px 0 10px}
  .tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; margin:0 -14px; padding:0 14px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none; display:flex; align-items:center; gap:7px; border:0; background:none; cursor:pointer;
    padding:10px 12px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--ink)}
  .tab.dim{color:#9a9aa2}
  .tab.on{background:var(--soft); box-shadow:inset 0 0 0 1px var(--line)}
  .crumbs{font-size:12px; color:var(--mute); margin:14px 0 18px}
  .crumbs b{color:var(--ink); font-weight:600}
  .crumbs i{font-style:normal; margin:0 6px}

  .view{display:none}
  .view.on{display:block; animation:fade .35s ease-out}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  /* ---------- кнопки, карточки ---------- */
  .btn{width:100%; height:50px; border:0; border-radius:8px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:10px; font-size:14.5px; font-weight:700; color:var(--btn-tx); background:var(--btn);
    background:linear-gradient(180deg, color-mix(in srgb, var(--btn) 82%, #fff) 0%, var(--btn) 60%);
    box-shadow:0 6px 16px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.12)}
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.45; cursor:default}
  .btn svg{flex:none}
  .card{border:1px solid var(--line); border-radius:10px; background:#fff; overflow:hidden}
  .chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:6px;
    padding:6px 9px; font-size:10.5px; font-weight:800; letter-spacing:.8px; background:#fff; white-space:nowrap;
    box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .pill{display:inline-block; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:800;
    letter-spacing:1px; background:var(--soft); border:1px solid var(--line)}
  .pill.dark{background:var(--btn); color:var(--btn-tx); border-color:var(--btn); border-radius:6px}

  /* главная */
  .titlerow{display:flex; align-items:flex-start; gap:10px}
  .titlerow h1{font-size:30px; font-weight:800}
  .titlerow .chip{margin-left:auto; margin-top:6px}
  .hello{color:#55555c; font-size:14px; margin-top:2px}
  .hero{margin-top:16px}
  .hero img{display:block; width:100%; aspect-ratio:546/300; object-fit:cover; border-radius:10px 10px 0 0; background:var(--soft)}
  .hero .in{padding:16px 18px 18px}
  .hero h2{font-size:34px; font-weight:800; margin-top:14px; letter-spacing:-1.2px}
  .hero p{color:#55555c; margin:8px 0 14px; font-size:14px}
  .hero .kick{margin-bottom:10px; font-size:10px}
  .stats{display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--line);
    padding:14px 18px; font-size:12px; color:#55555c}
  .stats > span{display:flex; align-items:center; gap:6px; white-space:nowrap}
  .stats b{color:var(--ink)}

  .sect{margin-top:34px}
  .sect .kick{color:#3a3a40; font-size:11px}
  .sect .kick em{font-style:normal; margin-right:12px}
  .sect-h{display:flex; gap:12px; margin-top:8px}
  .sect-h h2{font-size:28px; font-weight:800}
  .sect-h p{margin:6px 0 0; font-size:14px; color:#55555c}
  .count{margin-left:auto; text-align:right; flex:none}
  .count b{font-size:30px; font-weight:800}
  .count b small{font-size:18px; color:#8c8c94; font-weight:600}
  .count span{display:block; font-size:10px; font-weight:700; letter-spacing:.8px; color:#55555c; margin-top:4px}
  .count i{display:block; height:3px; background:var(--line); margin-top:8px; border-radius:2px; overflow:hidden}
  .count i em{display:block; height:100%; width:0; background:var(--ink); transition:width .5s}

  .task{margin-top:18px}
  .task img{display:block; width:100%; aspect-ratio:546/302; object-fit:cover; background:var(--soft)}
  .task .in{padding:16px 18px 18px}
  .task .meta{display:flex; align-items:center; gap:10px; font-size:11px; font-weight:800; letter-spacing:.8px}
  .task .num{border:1px solid var(--line); border-radius:5px; padding:3px 6px; background:var(--soft)}
  .task .st{margin-left:auto; font-weight:600; letter-spacing:0; font-size:12px; color:#55555c}
  .task.ok .st{color:#2b8a3e}
  .task h3{font-size:24px; font-weight:800; margin:14px 0 12px}
  .quote{display:flex; gap:12px; background:var(--soft); border:1px solid var(--line); border-left:3px solid var(--ink);
    border-radius:6px; padding:14px; font-size:14px; color:#55555c}
  .quote b{color:var(--ink)}
  .ic{width:30px; height:30px; flex:none; border:1px solid var(--line); border-radius:7px; background:#fff;
    display:flex; align-items:center; justify-content:center}
  .game{display:flex; align-items:center; gap:10px; margin:16px 0; font-size:14px; font-weight:500}
  .game i{width:13px; height:13px; background:#56565c; transform:rotate(-14deg); border-radius:2px; position:relative}
  .game i:after{content:""; position:absolute; left:4px; top:4px; width:5px; height:5px; background:#fff}
  .must{border:1px solid #d9d9de; border-radius:7px; text-align:center; padding:10px 8px; margin-bottom:10px;
    box-shadow:0 1px 0 rgba(0,0,0,.05)}
  .must b{display:block; font-size:11px; font-weight:800; letter-spacing:1.2px}
  .must span{font-size:12px; font-weight:600}
  .fin{margin-top:18px; padding:18px 16px}
  .fin .row1{display:flex; gap:12px; margin-bottom:16px}
  .fin h4{margin:0; font-size:15px; font-weight:700}
  .fin p{margin:2px 0 0; font-size:12.5px; color:#6e6e76}
  .foot{border-top:1px solid var(--line); margin-top:34px; padding-top:20px; display:flex; align-items:flex-end}
  .foot .l{display:flex; align-items:center; gap:12px; font-size:12px; font-weight:800; letter-spacing:1.4px}
  .foot .rbx-sq{width:26px; height:26px; border-radius:2px}
  .foot .rbx-sq:after{width:8px; height:8px; margin:-4px 0 0 -4px}
  .foot button{margin-left:auto; border:0; background:none; color:#6e6e76; font-size:12px; cursor:pointer; padding:20px 0 0}

  /* выбор */
  .center{text-align:center}
  .step{display:flex; justify-content:center; gap:8px}
  .big{font-size:38px; font-weight:800; line-height:1.08; letter-spacing:-1.6px; margin-top:14px}
  .lead{color:#55555c; font-size:14.5px; margin:14px 0 0}
  .center .kick{margin-top:22px; color:#3a3a40}
  .paths{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:24px}
  .path{position:relative; border:1px solid var(--line); border-radius:10px; padding:16px 14px 14px; cursor:pointer;
    background:linear-gradient(180deg,#fafafa,#f3f3f5); text-align:left; transition:box-shadow .2s, border-color .2s}
  .path.on{border-color:var(--ink); box-shadow:0 0 0 1px var(--ink), 0 10px 26px rgba(0,0,0,.08)}
  .path .kick{font-size:11px; margin:0}
  .path .radio{position:absolute; right:12px; top:13px; width:20px; height:20px; border-radius:50%;
    border:1.5px solid #c9c9cf; background:#fff}
  .path.on .radio{border-color:var(--ink); background:var(--ink)}
  .path.on .radio:after{content:""; position:absolute; left:6px; top:3px; width:5px; height:9px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
  .path .pic{height:140px; display:flex; align-items:center; justify-content:center; margin:6px 0 8px; font-size:70px}
  .path .pic img{max-width:100%; max-height:140px; object-fit:contain; mix-blend-mode:multiply}
  .path h3{font-size:24px; font-weight:800}
  .path p{margin:6px 0 0; font-size:12.5px; color:#6e6e76; min-height:36px}
  .path .pf{display:flex; align-items:center; border-top:1px solid var(--line); margin-top:18px; padding-top:12px;
    font-size:10px; font-weight:800; letter-spacing:.6px}
  .path .pf svg{margin-left:auto}
  .note{font-size:13px; font-weight:700; text-align:center; margin-top:12px}

  /* приз */
  .glow{position:relative}
  .set{margin-top:20px}
  .set .top{display:flex; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line);
    font-size:12.5px; font-weight:800; background:var(--soft)}
  .set .top span{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:10px; letter-spacing:.8px}
  .cells{display:grid; grid-template-columns:1fr 1fr}
  .cell{padding:22px 10px 20px; text-align:center; position:relative; overflow:hidden}
  .cell + .cell{border-left:1px solid var(--line)}
  .cell:before{content:""; position:absolute; inset:10%; border-radius:50%; filter:blur(30px); opacity:.6; z-index:0}
  .cell.r:before{background:#ffe6d6}
  .cell.i:before{background:#ebe6ff}
  .cell > *{position:relative; z-index:1}
  .cell .art{height:96px; display:flex; align-items:center; justify-content:center}
  .cell .art img{max-height:84px; max-width:100%; mix-blend-mode:multiply}
  .cell .kick{font-size:8.5px; color:#6e6e76; margin-top:8px}
  .cell .amt{font-size:30px; font-weight:800; letter-spacing:-1px; margin-top:2px; font-variant-numeric:tabular-nums}
  .cell .amt small{font-size:14px; font-weight:600; color:#55555c; letter-spacing:0}
  .cell .nm{font-size:17px; font-weight:800; letter-spacing:-.4px; margin-top:4px; line-height:1.2}
  .cell .sub{font-size:10.5px; color:#8c8c94; margin-top:2px}
  .get{margin:0 12px; border:1px solid #d9d9de; border-radius:8px; text-align:center; padding:12px 10px;
    box-shadow:0 2px 0 rgba(0,0,0,.04)}
  .get .pill{font-size:11px; padding:5px 10px}
  .get div{font-size:13px; font-weight:600; margin-top:8px}
  .luck{display:flex; align-items:center; justify-content:center; gap:10px; padding:16px 12px 6px; text-align:left}
  .luck b{display:block; font-size:11px; font-weight:800; letter-spacing:.6px}
  .luck span{font-size:10.5px; color:#8c8c94}
  .set .btn{margin:12px 12px 14px; width:calc(100% - 24px)}
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:6}

  /* спонсоры */
  .warnbox{background:var(--warn); border:1px solid var(--warn-line); border-radius:8px; padding:12px 14px;
    display:flex; gap:12px; margin-top:20px; text-align:left; box-shadow:0 2px 0 rgba(217,72,15,.05)}
  .warnbox b.t{display:block; color:#862e0c; font-size:11.5px; font-weight:800; letter-spacing:.4px}
  .warnbox div{font-size:12.5px; color:#3a3a40}
  .spbox{align-items:center}
  .spbox h4{margin:0 0 4px; font-size:14.5px; font-weight:700}
  .spbox .c{margin-left:auto; font-size:12px; font-weight:800; flex:none}
  .info{display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    margin-top:12px; font-size:11px; color:#55555c; text-align:left}
  .info b{color:var(--ink)}
  .sp{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:8px; padding:12px;
    margin-top:12px; text-align:left; box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .sp .lt{width:34px; height:34px; flex:none; border-radius:6px; background:var(--soft); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px}
  .sp .tx{flex:1; min-width:0}
  .sp .n{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sp .s{font-size:12px; color:#6e6e76}
  .sp button{border:0; border-radius:6px; background:var(--btn); color:var(--btn-tx); font-size:12px; font-weight:700;
    padding:10px 12px; cursor:pointer; flex:none}
  .sp.done button{background:var(--soft); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line)}
  .dock{position:sticky; bottom:0; padding:14px 0 10px; background:linear-gradient(180deg,rgba(255,255,255,0),var(--bg) 30%)}
  .dock .btn{font-size:14px; letter-spacing:.3px}
  .after{font-size:12px; color:#6e6e76; text-align:center; margin-top:8px}

  /* очередь */
  .clock{display:flex; justify-content:center; gap:8px; margin-top:12px}
  .clock div{min-width:76px; background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:10px 4px 8px}
  .clock b{display:block; font-size:32px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums}
  .clock span{font-size:10px; color:#8c8c94}
  .clock i{align-self:center; font-style:normal; font-size:24px; font-weight:800; color:#b0b0b6; margin-top:-16px}
  .qcard{margin-top:20px; padding:18px 14px; text-align:center}
  .qcard.ready .clock b{color:#2b8a3e}
  .qlist{border-top:1px solid var(--line); margin-top:18px; padding-top:6px; text-align:left}
  .qlist div{display:flex; align-items:center; gap:10px; padding:10px 2px; font-size:14px}
  .qlist div + div{border-top:1px solid var(--line)}
  .qlist b{margin-left:auto}
  .qlist img{width:28px; height:28px; object-fit:contain; mix-blend-mode:multiply}
  .qfine{margin-top:14px; font-size:12px; color:#55555c; background:var(--soft); border-radius:8px; padding:10px 12px}
  .qnote{margin-top:12px; font-size:14px; border:1px solid var(--line); border-radius:8px; padding:12px 14px}

  /* ---------- окна ---------- */
  .veil{position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:20px;
    background:rgba(120,120,128,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
  .veil.on{display:flex; animation:fadeIn .25s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{position:relative; width:100%; max-width:420px; background:#fff; border-radius:10px; padding:28px 20px 22px;
    box-shadow:0 30px 60px rgba(0,0,0,.25); animation:pop .3s ease-out}
  @keyframes pop{from{transform:translateY(12px) scale(.98); opacity:0}to{transform:none; opacity:1}}
  .shield{width:76px; height:76px; margin:0 auto; position:relative; display:flex; align-items:center; justify-content:center}
  .shield .ring{position:absolute; inset:0; border-radius:50%; border:2px solid #ececf0; border-top-color:var(--accent);
    animation:spin 1s linear infinite}
  .shield .core{width:62px; height:62px; border-radius:50%; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.08);
    display:flex; align-items:center; justify-content:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .modal .kick{text-align:center; margin-top:18px; color:#3a3a40}
  .modal h3{text-align:center; font-size:22px; font-weight:800; margin-top:8px}
  .modal .ms{text-align:center; font-size:13px; color:#6e6e76; margin-top:8px}
  .cks{margin-top:22px}
  .ck{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-top:10px}
  .ck img{width:56px; height:40px; object-fit:cover; border-radius:4px; flex:none}
  .ck .tx{flex:1; min-width:0}
  .ck b{display:block; font-size:13.5px}
  .ck span{font-size:11.5px; color:#8c8c94}
  .ck .mk{width:24px; height:24px; flex:none; border-radius:50%; border:1.5px solid #e1e1e6; position:relative}
  .ck.run{background:#f4f6ff; border-color:#b9c6f7}
  .ck.run .mk{border-color:#dfe5fb; border-right-color:var(--accent); animation:spin .8s linear infinite}
  .ck.ok .mk{background:var(--ink); border-color:var(--ink)}
  .ck.ok .mk:after{content:""; position:absolute; left:7.5px; top:4px; width:5px; height:10px; border:solid #fff;
    border-width:0 2px 2px 0; transform:rotate(45deg)}
  .ck.bad{border-color:#f2c1b0; background:var(--warn)}
  .ck.bad span{color:var(--red)}
  .ck.bad .mk{border-color:var(--red)}
  .ck.bad .mk:after{content:"!"; position:absolute; inset:0; text-align:center; line-height:21px; color:var(--red);
    font-weight:800; font-size:13px}
  .pbar{height:4px; background:#ececf0; border-radius:2px; margin-top:20px; overflow:hidden}
  .pbar i{display:block; height:100%; width:0; background:var(--accent); transition:width .5s}

  .x{position:absolute; right:14px; top:14px; width:32px; height:32px; border:1px solid var(--line); border-radius:6px;
    background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .nk .ic{width:46px; height:46px; border-radius:8px; background:var(--soft)}
  .nk .kick{text-align:left; margin-top:18px; font-size:10px}
  .nk h3{text-align:left; font-size:26px; line-height:1.15; letter-spacing:-.8px}
  .nk p{font-size:14px; color:#55555c; margin:12px 0 18px}
  .nk label{display:block; font-size:12px; font-weight:700; margin-bottom:8px}
  .nk input{width:100%; height:50px; border:1px solid #d9d9de; border-radius:7px; padding:0 14px; font:inherit;
    font-size:16px; outline:0; color:var(--ink)}
  .nk input:focus{border-color:var(--ink); box-shadow:0 0 0 2px var(--ink)}
  .nk .hint{font-size:11px; color:#8c8c94; margin-top:6px}
  .nk .err{font-size:12.5px; color:var(--red); font-weight:600; margin-top:6px; display:none}
  .nk .err.on{display:block}
  .nk .btn{margin-top:18px}
  .nk .ft{font-size:11px; color:#8c8c94; text-align:center; margin-top:14px}

  #magic{position:fixed; inset:0; z-index:25; background:#fff; display:none; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; overflow:hidden}
  #magic.on{display:flex; animation:fadeIn .3s}
  #magic h3{font-size:22px; font-weight:800; margin-top:16px; position:relative; z-index:2}
  #magic p{font-size:13px; color:#6e6e76; margin:8px 0 0; position:relative; z-index:2}
  .dots{display:flex; gap:6px; margin-top:16px; position:relative; z-index:2}
  .dots i{width:5px; height:5px; border-radius:50%; background:#9a9aa2; animation:dot 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes dot{50%{opacity:.25}}
  .bat{position:absolute; z-index:3; fill:#2b2b30; opacity:.85; animation:batfly linear forwards}
  @keyframes batfly{from{transform:translate(0,0) scale(var(--s))}to{transform:translate(var(--dx),var(--dy)) scale(var(--s))}}

  #toast{position:fixed; left:50%; bottom:8px; transform:translateX(-50%); z-index:60; background:#2a2a2e; color:#fff;
    border-radius:6px; padding:10px 16px; font-size:13px; display:none; width:max-content; max-width:88vw; text-align:center;
    box-shadow:0 10px 24px rgba(0,0,0,.25)}
  #toast.on{display:block; animation:fadeIn .2s}

  /* ---------- режим редактирования (только администратор) ---------- */
  #ed-fab{position:fixed; top:10px; right:10px; z-index:70; display:none; width:38px; height:38px; border-radius:50%;
    border:0; cursor:pointer; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.25); font-size:18px}
  body.admin #ed-fab{display:block}
  body.edit #ed-fab{display:none}
  #ed-bar{position:fixed; top:0; left:0; right:0; z-index:80; display:none; background:#111018; color:#fff;
    padding:8px 10px 10px; font-size:12px; box-shadow:0 6px 20px rgba(0,0,0,.3)}
  body.edit #ed-bar{display:block}
  body.edit{padding-top:100px}
  body.edit .veil, body.edit #magic{top:100px}
  .ed-row{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none}
  .ed-row::-webkit-scrollbar{display:none}
  .ed-row + .ed-row{margin-top:8px}
  .ed-chip{flex:none; border:0; border-radius:999px; padding:7px 11px; cursor:pointer; font-size:12px;
    font-weight:600; background:#2a2833; color:#fff}
  .ed-chip.on{background:#fff; color:#111}
  .ed-chip.save{background:#2f9e44}
  .ed-chip.save.dirty{background:#f08c00}
  .ed-hint{opacity:.6; margin:0 0 6px}
  body.edit [data-t], body.edit [data-img]{outline:1.5px dashed rgba(240,140,0,.9); outline-offset:2px; cursor:text}
  body.edit [data-t]:empty{display:inline-block; min-width:40px; min-height:14px}
  #ed-sheet{position:fixed; inset:0; z-index:90; display:none; background:rgba(10,10,15,.5); align-items:flex-end}
  #ed-sheet.on{display:flex}
  .ed-box{background:#fff; width:100%; max-height:86vh; overflow:auto; border-radius:16px 16px 0 0;
    padding:16px 14px 20px; animation:slide .25s ease-out}
  @keyframes slide{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
  .ed-box h4{margin:0 0 4px; font-size:16px}
  .ed-box .ed-sub{font-size:11px; color:#8c8c94; margin-bottom:10px}
  .ed-box textarea, .ed-box input[type=text], .ed-box input[type=number]{width:100%; border:1.5px solid var(--line);
    border-radius:8px; padding:10px; font:inherit; font-size:15px; resize:vertical; color:#111; background:#fff}
  .ed-box textarea{min-height:80px}
  .ed-box input[type=color]{width:56px; height:36px; border:0; padding:0; background:none}
  .ed-btns{display:flex; gap:8px; margin-top:12px}
  .ed-btns .btn{height:44px; font-size:14px; box-shadow:none; background:#111; color:#fff}
  .ed-group{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:#8c8c94; margin:18px 0 8px}
  .ed-item{margin-bottom:12px}
  .ed-item label{display:block; font-size:12px; font-weight:600; margin-bottom:4px}
  .ed-item textarea{min-height:44px}
  .ed-line{display:flex; align-items:center; gap:10px}
  .ed-line input[type=text]{flex:1}
  .ed-img{display:flex; gap:10px; align-items:center; margin-bottom:6px}
  .ed-img img{width:64px; height:44px; object-fit:cover; border-radius:6px; background:var(--soft); border:1px solid var(--line)}
  .ed-up{border:0; border-radius:8px; background:#111; color:#fff; font-size:13px; font-weight:600; padding:10px 12px; cursor:pointer}
  .ed-reset{border:0; background:none; color:#8c8c94; font-size:11px; cursor:pointer; padding:2px 0; text-decoration:underline}
</style>
</head>
<body>

<!-- загрузка -->
<div id="loader">
  <div class="blobs"><i></i><i></i><i></i></div>
  <div class="rbx-sq"></div>
  <div class="kick" data-t="ld_kicker"></div>
  <div class="ld-title"><span data-t="ld_t1"></span><br><span class="gray" data-t="ld_t2"></span></div>
  <div class="ld-sub" data-t="ld_sub"></div>
  <div class="ld-bar"><i id="ld-bar"></i></div>
  <div class="ld-cap" data-t="ld_cap"></div>
</div>

<div class="wrap">
  <div class="head">
    <div class="wordmark">R<span class="o"></span>BLOX</div>
    <div class="sep"></div>
    <div class="ev"><b data-t="h_title"></b><span data-t="h_sub"></span></div>
    <button class="who" id="who"><span class="ava" id="ava"></span><span id="who-name"></span></button>
  </div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55555c" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" data-t="search_ph" data-attr="placeholder" enterkeyhint="search" autocomplete="off">
    <span class="kbd">↵</span>
  </label>
  <div class="hr"></div>
  <div class="tabs" id="tabs">
    <button class="tab" data-tab="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span data-t="tab_home"></span></button>
    <button class="tab" data-tab="tasks"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg><span data-t="tab_tasks"></span></button>
    <button class="tab" data-tab="prize"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2-4-6-4-6-1.5S10 8 12 8zm0 0c2-4 6-4 6-1.5S14 8 12 8z"/></svg><span data-t="tab_prize"></span></button>
    <button class="tab" data-tab="queue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-t="tab_queue"></span></button>
  </div>
  <div class="crumbs"><span data-t="bc_root"></span><i>/</i><b id="crumb"></b></div>

  <!-- главная + задания -->
  <section class="view" id="v-home">
    <div class="titlerow">
      <div><h1 data-t="home_title"></h1><div class="hello" data-t="home_hello"></div></div>
      <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 20V10a6 6 0 0 1 12 0v10l-3-2-3 2-3-2z"/><circle cx="10" cy="10" r=".8"/><circle cx="14" cy="10" r=".8"/></svg><span data-t="home_chip"></span></span>
    </div>
    <div class="card hero">
      <img data-img="img.hero" alt="">
      <div class="in">
        <span class="chip" data-t="ev_tag"></span>
        <h2><span data-t="ev_t1"></span> <span class="gray" data-t="ev_t2"></span></h2>
        <p data-t="ev_text"></p>
        <div class="kick" data-t="ev_start"></div>
        <button class="btn" id="b-start"><span data-t="ev_btn"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </div>
      <div class="stats">
        <span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg><span data-t="ev_stat1"></span></span>
        <span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/></svg><span data-t="ev_stat2"></span></span>
      </div>
    </div>

    <div class="sect" id="tasks-sect">
      <div class="kick"><em data-t="tk_num"></em><span data-t="tk_kicker"></span></div>
      <div class="sect-h">
        <div><h2 data-t="tk_title"></h2><p data-t="tk_lead"></p><p data-t="tk_text"></p></div>
        <div class="count"><b id="tk-count">0<small> / 3</small></b><span data-t="tk_done_lbl"></span><i><em id="tk-bar"></em></i></div>
      </div>
      <div id="tasks"></div>
      <div class="card fin" id="fin">
        <div class="row1">
          <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
          <div><h4 data-t="fin_title"></h4><p data-t="fin_text"></p></div>
        </div>
        <button class="btn" id="b-check-tasks"><span data-t="fin_btn"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </div>
    </div>
  </section>

  <!-- выбор -->
  <section class="view center" id="v-choice">
    <div class="step"><span class="pill" data-t="ch_step"></span></div>
    <div class="kick" data-t="ch_kicker"></div>
    <div class="big"><span data-t="ch_t1"></span><br><span class="gray" data-t="ch_t2"></span></div>
    <p class="lead" data-t="ch_sub"></p>
    <div class="paths">
      <div class="path" data-choice="sweet">
        <span class="radio"></span>
        <div class="kick" data-t="sweet_path"></div>
        <div class="pic"><img data-img="img.sweet" alt=""></div>
        <h3 data-t="sweet_title"></h3>
        <p data-t="sweet_text"></p>
        <div class="pf"><span data-t="sweet_foot"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c.8 4.5 2.5 6.2 7 7-4.5.8-6.2 2.5-7 7-.8-4.5-2.5-6.2-7-7 4.5-.8 6.2-2.5 7-7z"/></svg></div>
      </div>
      <div class="path" data-choice="trick">
        <span class="radio"></span>
        <div class="kick" data-t="trick_path"></div>
        <div class="pic"><img data-img="img.trick" alt=""></div>
        <h3 data-t="trick_title"></h3>
        <p data-t="trick_text"></p>
        <div class="pf"><span data-t="trick_foot"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 20V10a6 6 0 0 1 12 0v10l-3-2-3 2-3-2z"/><circle cx="10" cy="10" r=".8"/><circle cx="14" cy="10" r=".8"/></svg></div>
      </div>
    </div>
    <button class="btn" id="b-surprise" style="margin-top:22px"><span data-t="ch_btn"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2-4-6-4-6-1.5S10 8 12 8zm0 0c2-4 6-4 6-1.5S14 8 12 8z"/></svg></button>
    <div class="note" data-t="ch_note"></div>
  </section>

  <!-- приз -->
  <section class="view center glow" id="v-prize">
    <div class="kick" style="margin-top:4px" data-t="pr_kicker"></div>
    <div class="big" style="font-size:34px"><span data-t="pr_t1"></span> <span class="gray" data-t="pr_t2"></span></div>
    <p class="lead" style="margin-top:8px; font-size:13px" data-t="pr_sub"></p>
    <div class="card set">
      <div class="top"><span style="margin:0; font-size:12.5px; letter-spacing:0" data-t="pr_set"></span>
        <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c.8 4.5 2.5 6.2 7 7-4.5.8-6.2 2.5-7 7-.8-4.5-2.5-6.2-7-7 4.5-.8 6.2-2.5 7-7z"/></svg><span data-t="pr_now"></span></span></div>
      <div class="cells">
        <div class="cell r">
          <div class="art"><svg class="rbx" width="84" height="84" viewBox="0 0 24 24"></svg></div>
          <div class="kick" data-t="pr_rbx_lbl"></div>
          <div class="amt"><span id="pr-amt">0</span> <small data-t="pr_rbx_unit"></small></div>
          <div class="sub" data-t="pr_rbx_sub"></div>
        </div>
        <div class="cell i">
          <div class="art"><img data-img="img.item" alt=""></div>
          <div class="kick" data-t="pr_item_lbl"></div>
          <div class="nm" data-t="pr_item"></div>
          <div class="sub" data-t="pr_item_sub"></div>
        </div>
      </div>
      <div class="get"><span class="pill dark" data-t="pr_get_pill"></span><div data-t="pr_get"></div></div>
      <div class="luck"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c.8 4.5 2.5 6.2 7 7-4.5.8-6.2 2.5-7 7-.8-4.5-2.5-6.2-7-7 4.5-.8 6.2-2.5 7-7z"/></svg></span>
        <div><b data-t="pr_luck"></b><span data-t="pr_chance"></span></div></div>
      <button class="btn" id="b-claim"><span data-t="pr_btn"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
    </div>
  </section>

  <!-- спонсоры -->
  <section class="view center" id="v-subs">
    <div class="step"><span class="pill" data-t="sb_step"></span><span class="pill dark" data-t="sb_badge"></span></div>
    <div class="big"><span data-t="sb_t1"></span><br><span class="gray" data-t="sb_t2"></span></div>
    <p class="lead" data-t="sb_lead"></p>
    <div class="warnbox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a3a40" stroke-width="1.8" style="flex:none"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>
      <div><b class="t" data-t="sb_warn_t"></b><span data-t="sb_warn"></span></div>
    </div>
    <div class="warnbox spbox">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
      <div><h4 data-t="sb_sp_t"></h4><span data-t="sb_sp"></span></div>
      <span class="c" id="sb-count">0 / 0</span>
    </div>
    <div class="info"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-t="sb_info"></span></div>
    <div id="rows"></div>
    <div class="dock">
      <button class="btn" id="b-subs"><span data-t="sb_btn"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
      <div class="after" data-t="sb_after"></div>
    </div>
  </section>

  <!-- очередь -->
  <section class="view center" id="v-queue">
    <div class="step"><span class="pill" data-t="q_step"></span></div>
    <div class="kick" data-t="q_kicker"></div>
    <div class="big"><span data-t="q_t1"></span><br><span class="gray" data-t="q_t2"></span></div>
    <p class="lead" data-t="q_sub"></p>
    <div class="card qcard" id="qcard">
      <div class="kick" style="margin:0; font-size:10px; color:#6e6e76" id="q-wait" data-t="q_wait"></div>
      <div class="clock">
        <div><b id="c-h">24</b><span data-t="q_h"></span></div><i>:</i>
        <div><b id="c-m">00</b><span data-t="q_m"></span></div><i>:</i>
        <div><b id="c-s">00</b><span data-t="q_s"></span></div>
      </div>
      <div class="qlist">
        <div><svg class="rbx" width="28" height="28" viewBox="0 0 24 24"></svg><span data-t="q_rbx"></span><b id="q-amt"></b></div>
        <div><img data-img="img.item" alt=""><span data-t="q_item"></span><b data-t="pr_item"></b></div>
      </div>
      <div class="qfine" data-t="q_fine"></div>
    </div>
    <div class="qnote" id="q-note"></div>
    <button class="btn" id="b-close" style="margin-top:18px"><span data-t="q_btn"></span></button>
  </section>

  <div class="foot">
    <div class="l"><div class="rbx-sq"></div><span data-t="foot_title"></span></div>
    <button id="b-about" data-t="foot_about"></button>
  </div>
</div>

<!-- проверка заданий -->
<div class="veil" id="ck-veil">
  <div class="modal">
    <div class="shield"><div class="ring"></div><div class="core"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg></div></div>
    <div class="kick" data-t="ck_kicker"></div>
    <h3 data-t="ck_title"></h3>
    <div class="ms" id="ck-sub" data-t="ck_sub"></div>
    <div class="cks" id="cks"></div>
    <div class="pbar"><i id="ck-bar"></i></div>
  </div>
</div>

<!-- ник -->
<div class="veil" id="nk-veil">
  <div class="modal nk">
    <button class="x" id="nk-x"><svg width="14" height="14" viewBox="0 0 24 24" stroke="#111" stroke-width="2.2"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
    <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 20V10a6 6 0 0 1 12 0v10l-3-2-3 2-3-2z"/><circle cx="10" cy="10" r=".9"/><circle cx="14" cy="10" r=".9"/><path d="M10 13.5c1.2.8 2.8.8 4 0"/></svg></span>
    <div class="kick" data-t="nk_kicker"></div>
    <h3 data-t="nk_title"></h3>
    <p data-t="nk_text"></p>
    <label for="nick" data-t="nk_label"></label>
    <input id="nick" data-t="nk_ph" data-attr="placeholder" maxlength="20" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="hint" data-t="nk_hint"></div>
    <div class="err" id="nk-err"></div>
    <button class="btn" id="b-nick"><span data-t="nk_btn"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
    <div class="ft" data-t="nk_foot"></div>
  </div>
</div>

<!-- об ивенте -->

  function confetti() {
    var c = el('confetti'), ctx = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
    var cols = ['#ff8a4c', '#ffb38a', '#8b7cf6', '#c7bdfd', '#f6c453', '#e64980'];
    var ps = [];
    for (var i = 0; i < 120; i++) ps.push({ x: Math.random() * W, y: -20 - Math.random() * H * .6, vx: (Math.random() - .5) * 1.6,
      vy: 1.6 + Math.random() * 2.6, r: Math.random() * 6, w: 4 + Math.random() * 5, h: 2 + Math.random() * 3,
      c: cols[i % cols.length], a: Math.random() * 6 });
    var t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.a += .08;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
        ctx.globalAlpha = Math.max(0, 1 - (t - t0) / 4200); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });

    st.data = Object.assign({}, SAMPLE, { prize_min: num('cfg.prize_min'), prize_max: num('cfg.prize_max') });
    st.nick = SAMPLE.username;
    if (id === 'load') { show('home'); el('loader').classList.remove('off'); }
    else if (id === 'home') show('home');
    else if (id === 'check') { show('home'); previewCheck(); }
    else if (id === 'choice') show('choice');
    else if (id === 'magic') { show('choice'); magic(true); }
    else if (id === 'prize') showPrize(true);
    else if (id === 'nick') { showPrize(true); openNick(); }
    else if (id === 'subs') showSubs();
    else if (id === 'queue') { st.data.deadline_ts = Date.now() / 1000 + num('cfg.hours') * 3600; st.offset = 0; showQueue(); }
    else if (id === 'about') { show('home'); el('ab-veil').classList.add('on'); }
    current = id; markScreen();
  }
  function markScreen() {
    Array.prototype.forEach.call(el('ed-screens').children, function (c) { c.classList.toggle('on', c.dataset.id === current); });
  }
  PREVIEW.forEach(function (p) {
    var b = document.createElement('button');
    b.className = 'ed-chip'; b.dataset.id = p[0]; b.textContent = p[1];
    b.addEventListener('click', function () { preview(p[0]); });
    el('ed-screens').appendChild(b);
  });
  function setDirty(key, value) {
    var saved = has(TX, key) ? TX[key] : null;
    if (value === saved) delete dirty[key]; else dirty[key] = value;
    el('ed-save').classList.toggle('dirty', Object.keys(dirty).length > 0);
    paint();
    if (st.view === 'queue' && st.data) tick();
  }
  function isChanged(key) { return T(key) !== META[key][1]; }
  function field(key, onInput) {
    var d = META[key], kind = d[4] || 'text', wrap = document.createElement('div'), inp;
    wrap.className = 'ed-item';
    wrap.innerHTML = '<label>' + esc(d[2]) + '</label>';
    if (kind === 'color') {
      var line = document.createElement('div'); line.className = 'ed-line';
      var pick = document.createElement('input'); pick.type = 'color';
      inp = document.createElement('input'); inp.type = 'text'; inp.value = T(key);
      pick.value = /^#[0-9a-f]{6}$/i.test(T(key)) ? T(key) : d[1];
      pick.addEventListener('input', function () { inp.value = pick.value; onInput(pick.value); });
      inp.addEventListener('input', function () {
        if (/^#[0-9a-f]{6}$/i.test(inp.value)) pick.value = inp.value;
        onInput(inp.value.trim());
      });
      line.appendChild(pick); line.appendChild(inp); wrap.appendChild(line);
    } else if (kind === 'img') {
      var row = document.createElement('div'); row.className = 'ed-img';
      var thumb = document.createElement('img'); thumb.src = T(key);
      var up = document.createElement('button'); up.className = 'ed-up'; up.textContent = '📷 Загрузить фото';
      var file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*'; file.style.display = 'none';
      inp = document.createElement('input'); inp.type = 'text'; inp.value = T(key); inp.placeholder = 'или ссылка https://…';
      up.addEventListener('click', function () { file.click(); });
      file.addEventListener('change', async function () {
        var f = file.files && file.files[0]; if (!f) return;
        up.textContent = 'Загружаю…';
        try {
          var r = await api('api/app/upload', f, f.type || 'image/jpeg');
          if (r.status >= 400) { toast(r.data.error || 'Не загрузилось'); return; }
          inp.value = r.data.url; thumb.src = r.data.url; onInput(r.data.url);
          toast('Картинка загружена — не забудь «Сохранить»');
        } catch (e) { toast('Ошибка сети — не загрузилось'); }
        finally { up.textContent = '📷 Загрузить фото'; file.value = ''; }
      });
      inp.addEventListener('input', function () { thumb.src = inp.value.trim(); onInput(inp.value.trim()); });
      row.appendChild(thumb); row.appendChild(up); row.appendChild(file);
      wrap.appendChild(row); wrap.appendChild(inp);
      wrap._thumb = thumb;
    } else {
      inp = document.createElement(kind === 'text' ? 'textarea' : 'input');
      if (kind === 'number') { inp.type = 'number'; inp.min = '0'; inp.inputMode = 'numeric'; }
      if (kind === 'url') { inp.type = 'text'; inp.placeholder = 'https://…'; }
      inp.value = T(key);
      inp.addEventListener('input', function () { onInput(inp.value); });
      wrap.appendChild(inp);
    }
    var reset = document.createElement('button');
    reset.className = 'ed-reset'; reset.textContent = 'вернуть как было';
    reset.style.display = isChanged(key) ? '' : 'none';
    reset.addEventListener('click', function () {
      setDirty(key, null); inp.value = T(key);
      if (wrap._thumb) wrap._thumb.src = T(key);
      var pk = wrap.querySelector('input[type=color]'); if (pk) pk.value = T(key);
      reset.style.display = 'none';
    });
    wrap.appendChild(reset);
    wrap._input = inp; wrap._reset = reset;
    return wrap;
  }
  function openSheet(build) { var box = el('ed-box'); box.innerHTML = ''; build(box); el('ed-sheet').classList.add('on'); }
  function closeSheet() { el('ed-sheet').classList.remove('on'); }
  el('ed-sheet').addEventListener('click', function (e) { if (e.target === el('ed-sheet')) closeSheet(); });
  function closeBtn(box) {
    var row = document.createElement('div'); row.className = 'ed-btns';
    var ok = document.createElement('button'); ok.className = 'btn'; ok.textContent = 'Готово';
    ok.addEventListener('click', closeSheet); row.appendChild(ok); box.appendChild(row);
  }
  var HINT = 'Можно: **жирный**, __подчёркнутый__, {player} — ник или «игрок», {acc} — ник, {prize} — сумма, ' +
    '{min}/{max} — Robux от/до, {hours} — часы, {chance} — шанс';
  function related(key) {
    var m = /^(t\d)_/.exec(key) || /^img\.(t\d)$/.exec(key);
    if (m) return [m[1] + '_title', m[1] + '_text', m[1] + '_game', m[1] + '_url', 'img.' + m[1]];
    if (key === 'tk_btn') return ['tk_btn', 't1_url', 't2_url', 't3_url'];
    return [key];
  }
  function editOne(key) {
    var keys = related(key);
    if (keys.indexOf(key) < 0) keys.unshift(key);
    openSheet(function (box) {
      var h = document.createElement('h4'); h.textContent = keys.length > 1 ? META[key][3] : META[key][2]; box.appendChild(h);
      var sub = document.createElement('div'); sub.className = 'ed-sub';
      sub.textContent = META[key][4] ? META[key][3] : HINT; box.appendChild(sub);
      var first = null;
      keys.forEach(function (k) {
        var f = field(k, function (v) { setDirty(k, v); f._reset.style.display = ''; });
        if (keys.length === 1) f.querySelector('label').style.display = 'none';
        if (k === key) first = f;
        box.appendChild(f);
      });
      closeBtn(box);
      if (first && !META[key][4]) setTimeout(function () { try { first._input.focus(); } catch (e) {} }, 250);
    });
  }
  function editList(filter, title, subText) {
    openSheet(function (box) {
      var h = document.createElement('h4'); h.textContent = title; box.appendChild(h);
      var sub = document.createElement('div'); sub.className = 'ed-sub'; sub.textContent = subText; box.appendChild(sub);
      var group = '';
      DEF.filter(filter).forEach(function (d) {
        if (d[3] !== group) {
          group = d[3];
          var g = document.createElement('div'); g.className = 'ed-group'; g.textContent = group; box.appendChild(g);
        }
        var f = field(d[0], function (v) { setDirty(d[0], v); f._reset.style.display = ''; });
        box.appendChild(f);
      });
      closeBtn(box);
    });
  }
  el('ed-all').addEventListener('click', function () {
    editList(function (d) { return !d[4]; }, 'Все тексты', HINT + '. Не забудь нажать «Сохранить».');
  });
  el('ed-design').addEventListener('click', function () {
    editList(function (d) { return !!d[4]; }, 'Картинки, ссылки, цвета, числа',
      'Картинку можно загрузить с телефона или вставить ссылку. Не забудь нажать «Сохранить».');
  });
  el('ed-save').addEventListener('click', async function () {
    if (!Object.keys(dirty).length) return toast('Нечего сохранять');
    try {
      var r = await api('api/app/texts', { texts: dirty });
      if (r.status >= 400) return toast(r.data.error || 'Не сохранилось');
      TX = r.data.texts || {}; dirty = {};
      el('ed-save').classList.remove('dirty');
      paint(); haptic('success'); toast('Сохранено ✅ Все увидят изменения');
    } catch (e) { toast('Ошибка сети — не сохранилось'); }
  });
  el('ed-exit').addEventListener('click', function () {
    var leave = function () { location.reload(); };
    if (!Object.keys(dirty).length) return leave();
    var q = 'Есть несохранённые изменения. Выйти без сохранения?';
    if (tg && tg.showConfirm) tg.showConfirm(q, function (ok) { if (ok) leave(); });
    else if (window.confirm(q)) leave();
  });
  el('ed-fab').addEventListener('click', function () {
    editing = true; document.body.classList.add('edit');
    nick.readOnly = true; el('search').readOnly = true;
    preview('home');
  });
  // в режиме редактирования нажатие — это правка, а не действие
  document.addEventListener('click', function (e) {
    if (!editing) return;
    if (e.target.closest('#ed-bar, #ed-sheet, #ed-fab')) return;
    e.preventDefault(); e.stopPropagation();
    var n = e.target.closest('[data-t], [data-img]');
    if (n) editOne(n.dataset.t || n.dataset.img);
  }, true);

  // ---------- запуск ----------
  renderTasks();
  show(stage() === 'choice' ? 'choice' : 'home');
  dimTabs();
  setTimeout(function () { el('ld-bar').style.width = '100%'; }, 50);
  var loaded = Promise.all([
    sleep(1700),
    api('api/app/texts').then(function (r) {
      if (r.status < 400) {
        TX = r.data.texts || {}; admin = !!r.data.admin;
        document.body.classList.toggle('admin', admin);
        renderTasks(); paint();
      }
    }).catch(function () {}),
    api('api/raffle').then(function (r) {
      if (!r.data || (r.data.status !== 'joined' && r.data.status !== 'picked')) return;
      setData(r.data); st.tasksOk = true;
    }).catch(function () {})
  ]);
  loaded.then(function () {
    el('loader').classList.add('off');
    if (editing) return;
    renderTasks(); dimTabs();
    var s = stage();
    if (s === 'queue') showQueue();
    else if (s === 'subs') showSubs();
    else if (s === 'prize') showPrize(true);
    else show(s === 'choice' ? 'choice' : 'home');
  });
})();
</script>
</body>
</html>
