<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Возраст аккаунта Roblox</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #17212b);
    --sec: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8a9aa9);
    --link: var(--tg-theme-link-color, #62bcf9);
    --btn: var(--tg-theme-button-color, #40a7e3);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --radius: 14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px 16px 32px;
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  h1{font-size:20px; margin:4px 0 4px; text-align:center}
  .sub{color:var(--hint); font-size:13px; text-align:center; margin-bottom:18px}
  form{display:flex; gap:8px}
  input{
    flex:1; min-width:0; padding:13px 14px; font-size:16px;
    border:1px solid transparent; border-radius:var(--radius);
    background:var(--sec); color:var(--text); outline:none;
  }
  input:focus{border-color:var(--btn)}
  button{
    padding:13px 18px; font-size:16px; font-weight:600; cursor:pointer;
    border:0; border-radius:var(--radius);
    background:var(--btn); color:var(--btn-text);
  }
  button:disabled{opacity:.6}
  .msg{margin-top:16px; padding:14px; border-radius:var(--radius);
       background:var(--sec); color:var(--hint); text-align:center}
  .msg.err{color:#ff6b6b}
  .card{margin-top:16px; background:var(--sec); border-radius:18px; padding:18px}
  .head{display:flex; align-items:center; gap:14px}
  .ava{width:64px; height:64px; border-radius:50%; background:var(--bg);
       object-fit:cover; flex:none}
  .names{min-width:0}
  .dn{font-size:18px; font-weight:600; overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap}
  .un{color:var(--hint); font-size:14px}
  .badges{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px}
  .badge{font-size:12px; padding:3px 9px; border-radius:999px;
         background:rgba(127,127,127,.22); color:var(--hint)}
  .badge.ok{background:rgba(76,175,80,.2); color:#5ed67a}
  .badge.ban{background:rgba(244,67,54,.2); color:#ff6b6b}
  .age{margin:18px 0 4px; text-align:center}
  .age .big{font-size:26px; font-weight:700; letter-spacing:-.3px}
  .age .cap{color:var(--hint); font-size:13px; margin-bottom:4px}
  .rows{margin-top:14px; border-top:1px solid rgba(127,127,127,.2)}
  .row{display:flex; justify-content:space-between; gap:12px;
       padding:10px 0; border-bottom:1px solid rgba(127,127,127,.12)}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--hint); font-size:14px}
  .row .v{font-size:14px; text-align:right; word-break:break-word}
  a{color:var(--link); text-decoration:none}
  .link{display:block; text-align:center; margin-top:14px; font-size:14px}
  .skel{opacity:.6; animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
</style>
</head>
<body>
  <h1>🎮 Возраст аккаунта Roblox</h1>
  <div class="sub">Введи ник — покажу дату регистрации и сколько лет аккаунту</div>

  <form id="f" autocomplete="off">
    <input id="q" name="username" placeholder="например, builderman"
           maxlength="60" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="go" type="submit">Найти</button>
  </form>

  <div id="out"></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var form = document.getElementById('f');
  var input = document.getElementById('q');
  var btn = document.getElementById('go');
  var out = document.getElementById('out');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function haptic(type) {
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
    }
  }
  function info(text, isErr) {
    out.innerHTML = '<div class="msg' + (isErr ? ' err' : '') + '">' +
      esc(text) + '</div>';
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('ru-RU',
      { day: '2-digit', month: 'long', year: 'numeric' });
  }
  function fmtNum(n) {
    return (n == null) ? '—' : n.toLocaleString('ru-RU');
  }

  function render(u) {
    var badges = '';
    if (u.has_verified_badge) badges += '<span class="badge ok">✅ verified</span>';
    if (u.is_banned) badges += '<span class="badge ban">🚫 аккаунт забанен</span>';
    if (u.age && u.age.years >= 10) badges += '<span class="badge">🏛 ветеран</span>';

    var rows = '';
    rows += row('Дата регистрации', fmtDate(u.created));
    rows += row('Всего дней', fmtNum(u.age ? u.age.total_days : null));
    rows += row('User ID', fmtNum(u.id));
    if (u.friends != null) rows += row('Друзья', fmtNum(u.friends));
    if (u.followers != null) rows += row('Подписчики', fmtNum(u.followers));
    if (u.description) rows += row('О себе', esc(u.description).slice(0, 300));

    out.innerHTML =
      '<div class="card">' +
        '<div class="head">' +
          (u.avatar_url
            ? '<img class="ava" src="' + esc(u.avatar_url) + '" alt="">'
            : '<div class="ava"></div>') +
          '<div class="names">' +
            '<div class="dn">' + esc(u.display_name || u.username) + '</div>' +
            '<div class="un">@' + esc(u.username) + '</div>' +
            (badges ? '<div class="badges">' + badges + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="age">' +
          '<div class="cap">Аккаунту</div>' +
          '<div class="big">' + esc(u.age_text) + '</div>' +
        '</div>' +
        '<div class="rows">' + rows + '</div>' +
        '<a class="link" id="prof" href="' + esc(u.profile_url) + '">' +
          'Открыть профиль на Roblox →</a>' +
      '</div>';

    var prof = document.getElementById('prof');
    if (prof && tg && tg.openLink) {
      prof.addEventListener('click', function (e) {
        e.preventDefault();
        tg.openLink(u.profile_url);
      });
    }
    haptic('success');
  }

  function row(k, v) {
    return '<div class="row"><div class="k">' + esc(k) +
           '</div><div class="v">' + v + '</div></div>';
  }

  var busy = false;
  async function search() {
    var name = input.value.trim();
    if (!name || busy) return;
    busy = true;
    btn.disabled = true;
    out.innerHTML = '<div class="msg skel">Ищем аккаунт…</div>';
    try {
      var url = '/api/roblox/user?username=' + encodeURIComponent(name);
      var res = await fetch(url, {
        headers: tg && tg.initData ? { 'X-Telegram-Init-Data': tg.initData } : {}
      });
      var data = await res.json();
      if (!res.ok || data.error) {
        haptic('error');
        info(data.error || 'Что-то пошло не так. Попробуй ещё раз.', true);
      } else {
        render(data);
      }
    } catch (e) {
      haptic('error');
      info('Нет связи с сервером. Проверь интернет.', true);
    } finally {
      busy = false;
      btn.disabled = false;
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred('light'); } catch (err) {}
    }
    search();
  });

  // Ник можно передать сразу: /app?username=builderman или start_param
  var preset = new URLSearchParams(location.search).get('username') ||
    (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  if (preset) { input.value = preset; search(); }
  else { input.focus(); }
})();
</script>
</body>
</html>
