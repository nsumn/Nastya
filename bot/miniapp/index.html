<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сколько ты в Roblox</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0d0a18;
    --card:#181231;
    --card-2:#211a3d;
    --text:#ffffff;
    --hint:#9d95bd;
    --p1:#8b5cff;
    --p2:#d946ef;
    --ok:#2ee6a8;
    --r:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); overflow-x:hidden;
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* мягкое свечение на фоне */
  body::before,body::after{
    content:""; position:fixed; width:340px; height:340px; border-radius:50%;
    filter:blur(90px); opacity:.5; z-index:0; pointer-events:none;
  }
  body::before{background:#6d28d9; top:-140px; left:-120px}
  body::after{background:#c026d3; bottom:-160px; right:-130px; opacity:.35}

  .screen{display:none; position:relative; z-index:1; padding:26px 16px 30px; min-height:100%}
  .screen.on{display:block; animation:in .32s cubic-bezier(.2,.8,.3,1)}
  @keyframes in{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}

  h1{font-size:25px; line-height:1.2; margin:0 0 8px; text-align:center; letter-spacing:-.4px}
  .lead{color:var(--hint); font-size:14px; text-align:center; margin:0 0 22px}
  .grad{background:linear-gradient(100deg,#c4b5fd,#f0abfc);
        -webkit-background-clip:text; background-clip:text; color:transparent}

  .hero{
    width:104px; height:104px; margin:6px auto 18px; border-radius:32px;
    display:flex; align-items:center; justify-content:center; font-size:52px;
    background:linear-gradient(140deg,var(--p1),var(--p2));
    box-shadow:0 18px 44px rgba(139,92,255,.45);
    animation:float 3.4s ease-in-out infinite;
  }
  @keyframes float{50%{transform:translateY(-8px)}}

  .field{position:relative; margin-bottom:12px}
  .field span{position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:18px}
  input{
    width:100%; padding:17px 16px 17px 46px; font-size:16px; color:var(--text);
    background:var(--card); border:1.5px solid rgba(255,255,255,.07);
    border-radius:var(--r); outline:none;
  }
  input:focus{border-color:var(--p1); box-shadow:0 0 0 4px rgba(139,92,255,.16)}
  input::placeholder{color:#6f6790}

  .btn{
    width:100%; padding:17px; font-size:16.5px; font-weight:700; color:#fff;
    border:0; border-radius:var(--r); cursor:pointer; position:relative; overflow:hidden;
    background:linear-gradient(100deg,var(--p1),var(--p2));
    box-shadow:0 12px 28px rgba(168,60,220,.36);
  }
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.6}
  .btn.ghost{background:var(--card); color:var(--hint); box-shadow:none; font-weight:600}
  .btn + .btn{margin-top:10px}
  .btn::after{                       /* блик */
    content:""; position:absolute; inset:0; transform:translateX(-120%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);
    animation:shine 3.6s ease-in-out infinite;
  }
  .btn.ghost::after{display:none}
  @keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}

  .plate{margin-top:14px; padding:14px; border-radius:var(--r); font-size:14px;
         text-align:center; background:var(--card); color:var(--hint)}
  .plate.err{color:#ff8a8a; background:rgba(255,90,90,.13); animation:shake .4s}
  .plate.ok{color:var(--ok); background:rgba(46,230,168,.13)}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* ---------- профиль ---------- */
  .prof{display:flex; align-items:center; gap:14px; padding:14px;
        background:var(--card); border-radius:var(--r); margin-bottom:14px}
  .ava{width:58px; height:58px; border-radius:50%; flex:none; background:var(--card-2);
       padding:2px; background-image:linear-gradient(140deg,var(--p1),var(--p2))}
  .ava img{width:100%; height:100%; border-radius:50%; display:block; background:var(--card-2)}
  .prof .nm{font-size:17px; font-weight:700; line-height:1.2}
  .prof .un{color:var(--hint); font-size:13.5px}
  .tag{display:inline-block; margin-top:5px; font-size:11px; font-weight:600;
       padding:3px 8px; border-radius:999px; background:rgba(46,230,168,.16); color:var(--ok)}
  .tag.ban{background:rgba(255,90,90,.16); color:#ff8a8a}

  /* ---------- рулетка ---------- */
  .odo-wrap{
    text-align:center; padding:24px 14px 20px; border-radius:26px; margin-bottom:14px;
    background:linear-gradient(150deg,rgba(139,92,255,.28),rgba(217,70,239,.2));
    border:1px solid rgba(217,70,239,.34);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.09);
  }
  .odo{display:flex; justify-content:center; gap:3px; height:62px; overflow:hidden}
  .dig{
    width:40px; height:62px; overflow:hidden; border-radius:12px;
    background:rgba(0,0,0,.28); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .dig .col{
    display:flex; flex-direction:column; transform:translateY(0);
    font-size:44px; font-weight:800; line-height:62px; font-variant-numeric:tabular-nums;
  }
  .dig .col i{height:62px; font-style:normal}
  .sep{width:12px; height:62px}
  .odo-cap{color:#e9d8ff; font-size:14px; margin-top:12px; font-weight:600}
  .odo-sub{color:var(--hint); font-size:12.5px; margin-top:2px}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:16px}
  .cell{background:var(--card); border-radius:15px; padding:13px 14px}
  .cell .k{color:var(--hint); font-size:12px; margin-bottom:3px}
  .cell .v{font-size:15px; font-weight:700}
  .cell.wide{grid-column:1 / -1}

  /* ---------- спонсоры ---------- */
  .bar{height:6px; border-radius:99px; background:var(--card); margin:0 0 16px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; border-radius:99px;
         background:linear-gradient(90deg,var(--p1),var(--p2)); transition:width .35s ease}
  .sp{display:flex; align-items:center; gap:11px; padding:10px 12px; margin-bottom:8px;
      background:var(--card); border-radius:15px}
  .sp .ic{width:38px; height:38px; flex:none; border-radius:12px; font-size:19px;
          display:flex; align-items:center; justify-content:center; background:var(--card-2)}
  .sp .t{flex:1; min-width:0; font-size:14.5px; font-weight:600;
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sp button{
    flex:none; min-width:104px; padding:10px 14px; font-size:13.5px; font-weight:700;
    color:#fff; border:0; border-radius:12px; cursor:pointer;
    background:linear-gradient(100deg,var(--p1),var(--p2));
  }
  .sp button:active{transform:scale(.96)}
  .sp button.done{background:var(--card-2); color:#6f6790; box-shadow:none}
  .sticky{position:sticky; bottom:0; padding:14px 0 0; margin-top:4px;
          background:linear-gradient(to top,var(--bg) 62%,transparent)}

  /* ---------- финал ---------- */
  .check{
    width:104px; height:104px; margin:20px auto 20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:52px;
    background:linear-gradient(140deg,#22c55e,var(--ok));
    box-shadow:0 16px 44px rgba(46,230,168,.36); animation:pop .5s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes pop{from{transform:scale(.3); opacity:0}to{transform:none; opacity:1}}
  .done-box{background:var(--card); border-radius:var(--r); padding:16px;
            text-align:center; font-size:15px; margin-bottom:16px}
</style>
</head>
<body>

<!-- 1 -->
<section id="s-start" class="screen on">
  <div class="hero">🎮</div>
  <h1>Сколько дней ты <span class="grad">в Roblox</span>?</h1>
  <p class="lead">Введи свой ник — найдём аккаунт и посчитаем всё до дня</p>
  <div class="field">
    <span>🔎</span>
    <input id="nick" placeholder="Твой ник в Roblox" maxlength="60"
           autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>
  <button class="btn" id="go">Найти аккаунт</button>
  <div id="start-msg"></div>
</section>

<!-- 2 -->
<section id="s-result" class="screen">
  <div class="prof">
    <div class="ava"><img id="r-ava" alt=""></div>
    <div style="min-width:0">
      <div class="nm" id="r-name"></div>
      <div class="un" id="r-nick"></div>
      <div id="r-tag"></div>
    </div>
  </div>
  <div class="odo-wrap">
    <div class="odo" id="r-odo"></div>
    <div class="odo-cap" id="r-cap">дней в Roblox</div>
    <div class="odo-sub" id="r-sub"></div>
  </div>
  <div class="grid" id="r-grid"></div>
  <button class="btn" id="get">Получить 🎁</button>
  <button class="btn ghost" id="again">Другой ник</button>
</section>

<!-- 3 -->
<section id="s-sponsors" class="screen">
  <h1>Остался <span class="grad">один шаг</span></h1>
  <p class="lead" id="sp-lead">Подпишись на каналы ниже</p>
  <div class="bar"><i id="sp-bar"></i></div>
  <div id="sp-list"></div>
  <div class="sticky">
    <button class="btn" id="check">Проверить подписку</button>
    <div id="sp-msg"></div>
  </div>
</section>

<!-- 4 -->
<section id="s-done" class="screen">
  <div class="check">✓</div>
  <h1>Готово!</h1>
  <p class="lead">Подписка подтверждена</p>
  <div class="done-box" id="done-text">Спасибо, что подписался на наши каналы.</div>
  <button class="btn ghost" id="done-again">Проверить другой ник</button>
</section>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var SCREENS = ['s-start', 's-result', 's-sponsors', 's-done'];
  var el = function (id) { return document.getElementById(id); };
  var state = { user: null, links: [], clicked: {}, reward: '' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function haptic(kind) {
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
    }
  }
  function tap() {
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    }
  }
  function show(id) {
    SCREENS.forEach(function (s) { el(s).classList.toggle('on', s === id); });
    window.scrollTo(0, 0);
  }
  function plate(box, text, kind) {
    el(box).innerHTML = text
      ? '<div class="plate ' + (kind || '') + '">' + esc(text) + '</div>' : '';
  }
  async function api(url) {
    var headers = tg && tg.initData ? { 'X-Telegram-Init-Data': tg.initData } : {};
    var res = await fetch(url, { headers: headers });
    var data = await res.json().catch(function () { return {}; });
    return { status: res.status, data: data };
  }
  function fmt(n) { return (n == null) ? '—' : n.toLocaleString('ru-RU'); }
  function fmtDate(iso) {
    var d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString('ru-RU',
      { day: '2-digit', month: 'long', year: 'numeric' });
  }

  // ---------- рулетка: каждая цифра крутится в своём окошке ----------
  function odometer(box, value) {
    var text = String(value), html = '';
    for (var i = 0; i < text.length; i++) {
      // разряды по три — чтобы 7457 читалось как 7 457
      if (i && (text.length - i) % 3 === 0) html += '<div class="sep"></div>';
      html += '<div class="dig"><div class="col">';
      for (var k = 0; k < 30; k++) html += '<i>' + (k % 10) + '</i>';
      html += '</div></div>';
    }
    box.innerHTML = html;

    var cols = box.querySelectorAll('.col');
    for (var j = 0; j < cols.length; j++) {
      (function (col, digit, idx) {
        var stop = 20 + digit;                 // два полных оборота и нужная цифра
        col.style.transform = 'translateY(0)';
        col.style.transition = 'none';
        requestAnimationFrame(function () {
          col.style.transition = 'transform ' + (1.1 + idx * 0.18) +
                                 's cubic-bezier(.16,.84,.24,1)';
          col.style.transform = 'translateY(-' + (stop * 62) + 'px)';
        });
      })(cols[j], +text[j], j);   // окошки идут по порядку цифр, разделители — не .col
    }
    setTimeout(function () { haptic('success'); }, 1400);
  }

  // ---------- 1. поиск ----------
  var busy = false;
  async function search() {
    var nick = el('nick').value.trim();
    if (!nick || busy) return;
    busy = true; el('go').disabled = true;
    plate('start-msg', 'Ищем аккаунт…');
    try {
      var r = await api('/api/roblox/user?username=' + encodeURIComponent(nick));
      if (r.status >= 400) {
        haptic('error');
        plate('start-msg', r.data.error || 'Не получилось. Попробуй ещё раз.', 'err');
      } else {
        plate('start-msg', '');
        state.user = r.data;
        renderResult(r.data);
        show('s-result');
      }
    } catch (e) {
      plate('start-msg', 'Нет связи с сервером.', 'err');
    } finally { busy = false; el('go').disabled = false; }
  }

  // ---------- 2. результат ----------
  function renderResult(u) {
    el('r-ava').src = u.avatar_url || '';
    el('r-name').textContent = u.display_name || u.username;
    el('r-nick').textContent = '@' + u.username;
    el('r-tag').innerHTML = u.is_banned
      ? '<span class="tag ban">аккаунт забанен</span>'
      : (u.has_verified_badge ? '<span class="tag">✓ verified</span>' : '');

    el('r-cap').textContent = 'дней в Roblox';
    el('r-sub').textContent = 'это ' + u.age_text;

    var cells = [
      ['Дата регистрации', fmtDate(u.created), true],
      ['Подписчики', fmt(u.followers)],
      ['Друзья', fmt(u.friends)],
      ['User ID', fmt(u.id)],
      ['Возраст', u.age.years + ' г.']
    ];
    el('r-grid').innerHTML = cells.map(function (c) {
      return '<div class="cell' + (c[2] ? ' wide' : '') + '">' +
        '<div class="k">' + esc(c[0]) + '</div>' +
        '<div class="v">' + esc(c[1]) + '</div></div>';
    }).join('');

    odometer(el('r-odo'), u.age.total_days);
  }

  // ---------- 3. спонсоры ----------
  async function openSponsors() {
    tap();
    el('get').disabled = true;
    try {
      var r = await api('/api/op/status');
      state.links = r.data.links || [];
      state.reward = r.data.reward_text || '';
      if (r.data.subscribed) { finish(); return; }
      renderSponsors();
      show('s-sponsors');
    } catch (e) {
      plate('start-msg', 'Нет связи с сервером.', 'err');
    } finally { el('get').disabled = false; }
  }

  function progress() {
    var total = state.links.length || 1;
    var done = Object.keys(state.clicked).length;
    el('sp-bar').style.width = Math.round(done / total * 100) + '%';
    el('sp-lead').textContent = done
      ? 'Отмечено ' + done + ' из ' + state.links.length
      : 'Подпишись на каналы ниже';
  }

  function renderSponsors() {
    el('sp-list').innerHTML = state.links.map(function (c, i) {
      var done = state.clicked[i];
      var m = String(c.title).match(/^\s*(\p{Extended_Pictographic}️?|\d️?⃣)/u);
      var icon = m ? m[1] : '📢';
      var name = m ? c.title.slice(m[0].length).trim() : c.title;
      return '<div class="sp">' +
        '<div class="ic">' + esc(icon) + '</div>' +
        '<div class="t">' + esc(name) + '</div>' +
        '<button data-i="' + i + '" class="' + (done ? 'done' : '') + '">' +
          (done ? 'Готово ✓' : 'Подписаться') + '</button></div>';
    }).join('');

    Array.prototype.forEach.call(el('sp-list').querySelectorAll('button'),
      function (b) {
        b.addEventListener('click', function () {
          var i = +b.dataset.i, link = state.links[i];
          state.clicked[i] = true;
          b.classList.add('done');
          b.textContent = 'Готово ✓';
          tap(); progress();
          if (!link || !link.url) return;
          if (tg && tg.openTelegramLink && link.url.indexOf('https://t.me/') === 0) {
            tg.openTelegramLink(link.url);
          } else if (tg && tg.openLink) { tg.openLink(link.url); }
          else { window.open(link.url, '_blank'); }
        });
      });
    progress();
  }

  async function checkSubscription() {
    el('check').disabled = true;
    plate('sp-msg', 'Проверяем…');
    try {
      var r = await api('/api/op/status');
      state.links = r.data.links || state.links;
      state.reward = r.data.reward_text || state.reward;
      if (r.data.subscribed) { haptic('success'); plate('sp-msg', ''); finish(); }
      else {
        haptic('error');
        plate('sp-msg', 'Подпишись, пожалуйста, на всех спонсоров 🙏', 'err');
      }
    } catch (e) {
      plate('sp-msg', 'Нет связи с сервером.', 'err');
    } finally { el('check').disabled = false; }
  }

  // ---------- 4. финал ----------
  function finish() {
    if (state.reward) el('done-text').textContent = state.reward;
    show('s-done');
  }

  el('go').addEventListener('click', search);
  el('nick').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') search();
  });
  el('get').addEventListener('click', openSponsors);
  el('check').addEventListener('click', checkSubscription);
  function restart() {
    el('nick').value = ''; plate('start-msg', ''); show('s-start'); el('nick').focus();
  }
  el('again').addEventListener('click', restart);
  el('done-again').addEventListener('click', restart);

  var preset = new URLSearchParams(location.search).get('username') ||
    (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  if (preset) { el('nick').value = preset; search(); }
  else { el('nick').focus(); }
})();
</script>
</body>
</html>
