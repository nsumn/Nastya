<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сколько ты в Roblox</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #14101f);
    --sec: var(--tg-theme-secondary-bg-color, #1e1830);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #9b93b5);
    --accent: #7b5cff;
    --accent-2: #a855f7;
    --done: #3a3550;
    --radius: 16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; padding:0;
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  .screen{display:none; padding:22px 16px 28px; min-height:100%}
  .screen.on{display:block; animation:fade .25s ease}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1}}

  h1{font-size:22px; margin:0 0 10px; text-align:center; line-height:1.25}
  .lead{color:var(--hint); font-size:14px; text-align:center; margin-bottom:22px}
  .logo{width:76px; height:76px; margin:8px auto 16px; border-radius:22px;
        display:flex; align-items:center; justify-content:center; font-size:38px;
        background:linear-gradient(135deg, var(--accent), var(--accent-2))}

  input{
    width:100%; padding:15px 16px; font-size:16px; margin-bottom:12px;
    border:1px solid transparent; border-radius:var(--radius);
    background:var(--sec); color:var(--text); outline:none;
  }
  input:focus{border-color:var(--accent)}
  .btn{
    width:100%; padding:15px 18px; font-size:16px; font-weight:600;
    border:0; border-radius:var(--radius); cursor:pointer; color:#fff;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .btn:disabled{opacity:.55}
  .btn.ghost{background:var(--sec); color:var(--text)}

  .plate{margin-top:14px; padding:13px 14px; border-radius:var(--radius);
         background:var(--sec); color:var(--hint); font-size:14px; text-align:center}
  .plate.err{color:#ff7a7a; background:rgba(255,90,90,.12)}
  .plate.ok{color:#6ee7a0; background:rgba(80,220,140,.12)}

  /* --- экран результата --- */
  .who{display:flex; align-items:center; gap:14px; margin-bottom:18px}
  .ava{width:60px; height:60px; border-radius:50%; background:var(--sec); flex:none}
  .who .nm{font-size:18px; font-weight:600}
  .who .un{color:var(--hint); font-size:14px}
  .counter{
    text-align:center; padding:26px 16px; border-radius:24px; margin-bottom:16px;
    background:linear-gradient(135deg, rgba(123,92,255,.22), rgba(168,85,247,.22));
    border:1px solid rgba(168,85,247,.35);
  }
  .counter .num{
    font-size:52px; font-weight:800; letter-spacing:-1px;
    font-variant-numeric:tabular-nums; line-height:1.05;
  }
  .counter .cap{color:var(--hint); font-size:14px; margin-top:6px}
  .rows{background:var(--sec); border-radius:var(--radius); padding:4px 14px}
  .row{display:flex; justify-content:space-between; gap:12px; padding:12px 0;
       border-bottom:1px solid rgba(255,255,255,.06); font-size:14px}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--hint)}
  .row .v{text-align:right}

  /* --- спонсоры --- */
  .sp{display:flex; align-items:center; gap:12px; padding:11px 14px;
      background:var(--sec); border-radius:var(--radius); margin-bottom:8px}
  .sp .t{flex:1; min-width:0; font-size:15px; overflow:hidden;
         text-overflow:ellipsis; white-space:nowrap}
  .sp button{
    flex:none; padding:9px 16px; font-size:14px; font-weight:600; color:#fff;
    border:0; border-radius:12px; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .sp button.done{background:var(--done); color:var(--hint)}
  .sticky{position:sticky; bottom:0; padding:12px 0 0;
          background:linear-gradient(to top, var(--bg) 70%, transparent)}
  .skel{opacity:.6; animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
</style>
</head>
<body>

<!-- 1. приветствие -->
<section id="s-start" class="screen on">
  <div class="logo">🎮</div>
  <h1>Сколько ты уже в Roblox?</h1>
  <div class="lead">Напиши свой ник — найдём твой аккаунт и посчитаем,
    сколько дней ты в игре.</div>
  <input id="nick" placeholder="Твой ник в Roblox" maxlength="60"
         autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="btn" id="go">🔍 Поиск</button>
  <div id="start-msg"></div>
</section>

<!-- 2. спонсоры -->
<section id="s-sponsors" class="screen">
  <h1>Остался один шаг</h1>
  <div class="lead">Подпишись на каналы ниже — и результат откроется.</div>
  <div id="sp-list"></div>
  <div class="sticky">
    <button class="btn" id="check">Проверить подписку</button>
    <div id="sp-msg"></div>
  </div>
</section>

<!-- 3. результат -->
<section id="s-result" class="screen">
  <div class="who">
    <img class="ava" id="r-ava" alt="">
    <div>
      <div class="nm" id="r-name"></div>
      <div class="un" id="r-nick"></div>
    </div>
  </div>
  <div class="counter">
    <div class="num" id="r-days">0</div>
    <div class="cap" id="r-caption">дней в Roblox</div>
  </div>
  <div class="rows" id="r-rows"></div>
  <div style="margin-top:16px">
    <button class="btn ghost" id="again">Проверить другой ник</button>
  </div>
</section>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var el = function (id) { return document.getElementById(id); };
  var state = { user: null, links: [], clicked: {} };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function haptic(kind) {
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
    }
  }
  function show(id) {
    ['s-start', 's-sponsors', 's-result'].forEach(function (s) {
      el(s).classList.toggle('on', s === id);
    });
    window.scrollTo(0, 0);
  }
  function plate(box, text, kind) {
    el(box).innerHTML = text
      ? '<div class="plate ' + (kind || '') + '">' + esc(text) + '</div>' : '';
  }
  function headers() {
    return tg && tg.initData ? { 'X-Telegram-Init-Data': tg.initData } : {};
  }
  async function api(url) {
    var res = await fetch(url, { headers: headers() });
    var data = await res.json().catch(function () { return {}; });
    return { status: res.status, data: data };
  }
  function fmt(n) { return (n == null) ? '—' : n.toLocaleString('ru-RU'); }
  function fmtDate(iso) {
    var d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString('ru-RU',
      { day: '2-digit', month: 'long', year: 'numeric' });
  }

  // ---- поиск ника ----
  var busy = false;
  async function search() {
    var nick = el('nick').value.trim();
    if (!nick || busy) return;
    busy = true;
    el('go').disabled = true;
    plate('start-msg', 'Ищем аккаунт…', '');
    try {
      var r = await api('/api/roblox/user?username=' + encodeURIComponent(nick));
      if (r.status === 403 && r.data.need_subscribe) {
        plate('start-msg', '');
        state.links = r.data.need_subscribe;
        renderSponsors();
        show('s-sponsors');
      } else if (r.status >= 400) {
        haptic('error');
        plate('start-msg', r.data.error || 'Не получилось. Попробуй ещё раз.', 'err');
      } else {
        plate('start-msg', '');
        state.user = r.data;
        renderResult(r.data);
        show('s-result');
      }
    } catch (e) {
      plate('start-msg', 'Нет связи с сервером.', 'err');
    } finally {
      busy = false;
      el('go').disabled = false;
    }
  }

  // ---- спонсоры ----
  function renderSponsors() {
    el('sp-list').innerHTML = state.links.map(function (c, i) {
      var done = state.clicked[i];
      return '<div class="sp">' +
        '<div class="t">' + esc(c.title) + '</div>' +
        '<button data-i="' + i + '" class="' + (done ? 'done' : '') + '">' +
          (done ? 'Готово ✓' : 'Подписаться') + '</button>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(el('sp-list').querySelectorAll('button'),
      function (b) {
        b.addEventListener('click', function () {
          var i = +b.dataset.i, link = state.links[i];
          state.clicked[i] = true;
          b.classList.add('done');
          b.textContent = 'Готово ✓';
          if (tg && tg.HapticFeedback) {
            try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
          }
          if (!link.url) return;
          if (tg && /(^https:\/\/t\.me\/)/.test(link.url) && tg.openTelegramLink) {
            tg.openTelegramLink(link.url);
          } else if (tg && tg.openLink) {
            tg.openLink(link.url);
          } else {
            window.open(link.url, '_blank');
          }
        });
      });
  }

  async function checkSubscription() {
    el('check').disabled = true;
    plate('sp-msg', 'Проверяем…', '');
    try {
      var nick = el('nick').value.trim();
      var r = await api('/api/roblox/user?username=' + encodeURIComponent(nick));
      if (r.status === 403 && r.data.need_subscribe) {
        haptic('error');
        state.links = r.data.need_subscribe;
        plate('sp-msg', 'Подпишись, пожалуйста, на всех спонсоров 🙏', 'err');
      } else if (r.status >= 400) {
        plate('sp-msg', r.data.error || 'Не получилось. Попробуй ещё раз.', 'err');
      } else {
        haptic('success');
        plate('sp-msg', 'Готово! Открываем результат ✅', 'ok');
        state.user = r.data;
        renderResult(r.data);
        setTimeout(function () { show('s-result'); plate('sp-msg', ''); }, 600);
      }
    } catch (e) {
      plate('sp-msg', 'Нет связи с сервером.', 'err');
    } finally {
      el('check').disabled = false;
    }
  }

  // ---- результат со счётчиком «рулеткой» ----
  function countTo(node, target, ms) {
    var start = performance.now();
    function step(now) {
      var p = Math.min(1, (now - start) / ms);
      var eased = 1 - Math.pow(1 - p, 3);       // быстро в начале, мягко в конце
      node.textContent = Math.round(target * eased).toLocaleString('ru-RU');
      if (p < 1) requestAnimationFrame(step);
      else haptic('success');
    }
    requestAnimationFrame(step);
  }

  function renderResult(u) {
    el('r-ava').src = u.avatar_url || '';
    el('r-name').textContent = u.display_name || u.username;
    el('r-nick').textContent = '@' + u.username;
    el('r-caption').textContent = 'дней в Roblox — это ' + u.age_text;

    var rows = [
      ['Дата регистрации', fmtDate(u.created)],
      ['Возраст аккаунта', esc(u.age_text)],
      ['User ID', fmt(u.id)],
    ];
    if (u.followers != null) rows.push(['Подписчики', fmt(u.followers)]);
    if (u.friends != null) rows.push(['Друзья', fmt(u.friends)]);
    if (u.is_banned) rows.push(['Статус', '🚫 аккаунт забанен']);
    else if (u.has_verified_badge) rows.push(['Статус', '✅ verified']);
    el('r-rows').innerHTML = rows.map(function (r) {
      return '<div class="row"><div class="k">' + esc(r[0]) +
             '</div><div class="v">' + r[1] + '</div></div>';
    }).join('');

    el('r-days').textContent = '0';
    countTo(el('r-days'), u.age.total_days, 1600);
  }

  el('go').addEventListener('click', search);
  el('nick').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') search();
  });
  el('check').addEventListener('click', checkSubscription);
  el('again').addEventListener('click', function () {
    el('nick').value = '';
    plate('start-msg', '');
    show('s-start');
    el('nick').focus();
  });

  var preset = new URLSearchParams(location.search).get('username') ||
    (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  if (preset) { el('nick').value = preset; search(); }
  else { el('nick').focus(); }
})();
</script>
</body>
</html>
