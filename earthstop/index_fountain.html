<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-kr/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-kr/500.css">
<link rel="stylesheet" href="node_modules/pretendard/dist/web/static/pretendard.css">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  #wrap{position:relative;width:1080px;height:1920px;overflow:hidden}
  canvas{display:block}
  .ov{position:absolute;left:0;right:0;pointer-events:none}
  /* title (serif, word by word), countdown HUD (Man_ia_c-style timer, our own layout), captions at the series height 1250 px */
  #title{top:560px;text-align:center;font-family:'Noto Serif KR',serif;font-weight:500;color:#fff;font-size:70px;line-height:1.36;padding:0 100px;letter-spacing:-.01em;
    text-shadow:0 1px 3px rgba(0,0,0,.45),0 2px 26px rgba(10,15,30,.65)}
  #title .hl{color:#ffcf7a}
  #title span.w{display:inline-block}
  #hud{left:92px;top:330px;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.6),0 1px 14px rgba(0,0,0,.55)}
  #lab{font-family:'Pretendard',sans-serif;font-weight:600;font-size:25px;letter-spacing:.12em;opacity:.92}
  #lab b{display:inline-block;width:12px;height:12px;border-radius:50%;background:#ff4a3d;margin-right:12px;vertical-align:2px}
  #val{font-family:'Pretendard',sans-serif;font-weight:300;font-size:92px;line-height:1.05;margin-top:4px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  #sub{font-family:'Pretendard',sans-serif;font-weight:500;font-size:22px;letter-spacing:.1em;opacity:.8;margin-top:8px}
  #big{top:360px;text-align:center;font-family:'Pretendard',sans-serif;font-weight:200;font-size:210px;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.01em;opacity:0;
    text-shadow:0 0 6px rgba(0,0,0,.5),0 2px 40px rgba(0,0,0,.55)}
  #cap{top:1250px;text-align:center;font-family:'Pretendard',sans-serif;font-weight:600;color:#fff;font-size:50px;line-height:1.42;padding:0 170px;
    text-shadow:0 0 3px rgba(0,0,0,.85),0 1px 10px rgba(0,0,0,.8),0 2px 26px rgba(0,0,0,.6),0 0 60px rgba(0,0,0,.35)}
  #cap span.w{display:inline-block}
  #cap .hl{color:#ffcf7a}
  #cap .m{font-size:26px;letter-spacing:.14em;font-weight:700;color:#9fd0ff;display:block;margin-bottom:6px}
  #mark{top:392px;right:96px;left:auto;text-align:right;font-family:'Pretendard',sans-serif;font-weight:800;font-size:40px;letter-spacing:.02em;color:rgba(255,255,255,.8);text-shadow:0 1px 8px rgba(0,0,0,.4)}
  #mark small{display:block;font-weight:500;font-size:20px;letter-spacing:.06em;opacity:.85;margin-top:2px}
  #flash{top:0;bottom:0;background:#eef3ff;opacity:0}
  #end{top:0;bottom:0;background:#0e0f13;opacity:0}
  #endT{top:600px;text-align:center;font-family:'Noto Serif KR',serif;font-weight:500;color:#f2f0ea;font-size:64px;line-height:1.4;opacity:0;padding:0 110px}
  #endT .hl{color:#ffcf7a}
  #endS{top:900px;text-align:center;font-family:'Pretendard',sans-serif;font-weight:500;color:#c9c6be;font-size:36px;line-height:1.75;opacity:0;padding:0 140px}
  #endS b{color:#f2f0ea;font-weight:700}
  .pass-scene .txt{visibility:hidden!important}
  .pass-text canvas,.pass-text .gfx{visibility:hidden!important}
  html.pass-text,html.pass-text body{background:transparent!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="flash" class="ov gfx"></div>
  <div id="hud" class="ov txt"><div id="lab"></div><div id="val"></div><div id="sub"></div></div>
  <div id="big" class="ov txt"></div>
  <div id="title" class="ov txt"></div>
  <div id="cap" class="ov txt"></div>
  <div id="mark" class="ov txt">뚝딱<small>@ttukttak3d</small></div>
  <div id="end" class="ov gfx"></div>
  <div id="endT" class="ov txt">만약 <span class="hl">반포대교</span> 분수가<br><span class="hl">1000배</span> 세진다면?</div>
  <div id="endS" class="ov txt">분당 190톤이 <b>19만 톤</b>.<br>5초면 <b>1만 6천 톤</b> — 수영장 6개.<br>한강 흐름의 <b>20배</b>를 퍼올리고<br>공원엔 <b>폭우</b>가 쏟아진다.<br><br>다음엔 뭐가 1000배? 댓글로 👇<br><br><b>@ttukttak3d</b></div>
</div>
<script>window.PASS=new URLSearchParams(location.search).get("pass")||"all"; document.documentElement.classList.add("pass-"+window.PASS);</script>

<script type="module" src="scene_fountain.js"></script>
</body>
</html>
