<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css"><link rel="stylesheet" href="node_modules/@fontsource/inter/900.css"><link rel="stylesheet" href="node_modules/@fontsource/anton/400.css">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  #wrap{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0b0f16}
  .vO #wrap{background:transparent}
  .vE #wrap{background:radial-gradient(circle at 50% 40%,#1c2a52,#070b16 70%)}
  #flag{position:absolute;left:0;top:0;opacity:.9}
  #ov{position:absolute;inset:0;transform-origin:50% 45%}
  #mos{position:absolute;left:540px;top:900px;width:1026px;height:1752px;transform-origin:16% 12%}
  .tile{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.18)}
  .tile img,.lay img{width:100%;height:100%;object-fit:cover}
  #vig{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,0) 35%,rgba(0,0,0,.65) 100%),linear-gradient(rgba(5,8,14,.55),rgba(5,8,14,0) 35%,rgba(5,8,14,0) 55%,rgba(5,8,14,.75))}
  .lay{position:absolute;inset:0;transform-origin:50% 60%}
  .lay.mid{clip-path:inset(30% 0 0 0)} .lay.low{clip-path:inset(62% 0 0 0)}
  #glow{position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,220,160,.5),rgba(255,220,160,0) 45%);mix-blend-mode:screen}
  #sweep{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.18) 50%,rgba(255,255,255,0) 60%) no-repeat;background-size:1400px 1920px;mix-blend-mode:screen}
  #cal{position:absolute;left:540px;top:640px;width:430px;border-radius:30px;overflow:hidden;background:#fbfaf6;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;transform-origin:50% 0}
  #cal .m{background:linear-gradient(#e0242c,#b81820);color:#fff;font-family:'Anton';font-size:48px;padding:8px 0;letter-spacing:.06em}
  #cal .dd{font-family:'Anton';font-size:250px;line-height:1.05;color:#111} #cal .dw{font-family:'Inter';font-weight:900;font-size:30px;letter-spacing:.2em;color:#2a6af0;padding:0 0 22px}
  #tick{position:absolute;left:0;right:0;top:1140px;height:62px;background:rgba(8,10,16,.88);overflow:hidden;border-top:3px solid #e0242c;border-bottom:3px solid #e0242c}
  #tick .lbl{position:absolute;left:0;top:0;bottom:0;z-index:2;background:#e0242c;color:#fff;font-family:'Anton';font-size:40px;padding:2px 22px}
  #tick .crawl{position:absolute;left:260px;top:12px;white-space:nowrap;font-family:'Inter';font-weight:900;font-size:30px;letter-spacing:.06em;color:#fff}
  #date{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:350px;font-family:'Inter';font-weight:900;font-size:34px;letter-spacing:.14em;color:#0b0f16;background:#ffc23a;padding:10px 22px}
  #tt{position:absolute;left:40px;right:40px;top:430px;text-align:center;font-family:'Anton';font-size:118px;line-height:1.0;color:#fff;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.85)}
  #tt .r{color:#ffc23a} #tt .s{font-size:76px}
  .vE #tt{top:1290px;display:none}
  #cap{position:absolute;left:0;right:0;top:1250px;text-align:center;font-family:'Inter';font-weight:900;font-size:54px;line-height:1.28;color:#fff;padding:0 150px;text-shadow:0 2px 14px rgba(0,0,0,.85)}
  #cap span{padding:0 9px;margin:0 -5px;border-radius:8px} #cap span.y{background:#ffd23a;color:#0b0f16;text-shadow:none}
  .vE #cap{top:1250px}
  #wf{position:absolute;inset:0;background:#fff;pointer-events:none}
</style></head>
<body><div id="wrap"><div id="ov"></div></div>
<script>const CLIPN = 99;</script>
<script src="scene_intro.js"></script>
</body></html>
