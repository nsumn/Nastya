<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-kr/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-kr/500.css">
<link rel="stylesheet" href="node_modules/pretendard/dist/web/static/pretendard.css">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  #wrap{position:relative;width:1080px;height:1920px;overflow:hidden}
  canvas{display:block}
  .ov{position:absolute;left:0;right:0;pointer-events:none}
  /* ifcam-like typography: thin serif Korean title/captions, small sans labels, soft dark halo behind the HUD. TikTok safe zones kept (top > 320, captions at 1250). */
  #title{top:640px;text-align:center;font-family:'Noto Serif KR',serif;font-weight:400;color:#fff;font-size:68px;line-height:1.38;padding:0 110px;letter-spacing:-.01em;
    text-shadow:0 1px 3px rgba(0,0,0,.35),0 2px 26px rgba(20,30,45,.55)}
  #title .hl{color:#ffe3a3}
  /* our own HUD: a frosted-glass card (Korean app UI feel) instead of a dark halo */
  #halo{display:none}
  #hud{left:84px;top:372px;right:auto;color:#fff;padding:22px 34px 24px;border-radius:30px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.38);
    backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 10px 40px rgba(20,30,50,.18);text-shadow:0 1px 6px rgba(0,0,0,.25)}
  #lab{font-family:'Pretendard',sans-serif;font-weight:500;font-size:24px;letter-spacing:.06em;opacity:.85}
  #val{font-family:'Pretendard',sans-serif;font-weight:700;font-size:88px;line-height:1.08;margin-top:2px;letter-spacing:-.01em}
  #sub{font-family:'Pretendard',sans-serif;font-weight:500;font-size:24px;letter-spacing:.04em;opacity:.85;margin-top:8px}
  #cap{top:1250px;text-align:center;font-family:'Pretendard',sans-serif;font-weight:600;color:#fff;font-size:50px;line-height:1.42;padding:0 170px;
    text-shadow:0 0 3px rgba(0,0,0,.55),0 1px 12px rgba(0,0,0,.55),0 2px 30px rgba(0,0,0,.35)}
  #mark{top:640px;right:170px;left:auto;font-family:'Pretendard',sans-serif;font-weight:600;font-size:22px;letter-spacing:.32em;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.4)}
  #end{top:0;bottom:0;background:#101114;opacity:0}
  #endT{top:640px;text-align:center;font-family:'Noto Serif KR',serif;font-weight:400;color:#f2f0ea;font-size:62px;line-height:1.4;opacity:0;padding:0 120px}
  #endS{top:1000px;text-align:center;font-family:'Pretendard',sans-serif;font-weight:500;color:#c9c6be;font-size:34px;line-height:1.75;opacity:0;padding:0 150px}
  .pass-scene .txt{visibility:hidden!important}
  .pass-text canvas,.pass-text .gfx{visibility:hidden!important}
  html.pass-text,html.pass-text body{background:transparent!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="halo" class="ov txt"></div>
  <div id="hud" class="ov txt"><div id="lab"></div><div id="val"></div><div id="sub"></div></div>
  <div id="title" class="ov txt">만약 내 키가<br><span class="hl">1.5초마다 2배</span>가 된다면?</div>
  <div id="cap" class="ov txt"></div>
  <div id="end" class="ov gfx"></div>
  <div id="endT" class="ov txt"></div>
  <div id="endS" class="ov txt"></div>
</div>
<script>window.PASS=new URLSearchParams(location.search).get("pass")||"all"; document.documentElement.classList.add("pass-"+window.PASS);</script>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module" src="scene_growkr.js"></script>
</body>
</html>
