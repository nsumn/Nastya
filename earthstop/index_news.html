<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/source-serif-4/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/source-serif-4/400-italic.css">
<link rel="stylesheet" href="node_modules/@fontsource/source-serif-4/500-italic.css">

<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  #wrap{position:relative;width:1080px;height:1920px;overflow:hidden}
  canvas{display:block}
  .ov{position:absolute;left:0;right:0;pointer-events:none}
  .hl{color:#ffb048;text-shadow:0 2px 16px rgba(40,15,0,.85),0 0 4px rgba(40,15,0,.8)}
  .lb{position:absolute;transform:translate(-50%,-100%);font-family:'Inter';font-weight:600;font-size:28px;letter-spacing:.16em;color:#ffd9a0;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.9)}
  /* TikTok safe zones: top < 320, right column x > 900 (y 950-1670), bottom > 1650, ~57px side crop */
  #title{top:400px;text-align:center;font-family:'Source Serif 4';font-weight:400;color:#fff;font-size:76px;line-height:1.12;padding:0 90px;text-shadow:0 2px 18px rgba(0,0,0,.75),0 0 4px rgba(0,0,0,.6)}
  #hud{top:360px;text-align:center;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.9),0 1px 12px rgba(0,0,0,.85),0 0 28px rgba(0,0,0,.5);opacity:0}
  #stat{font-family:'Inter';font-weight:600;font-size:24px;letter-spacing:.18em;opacity:.95;height:34px}
  #stat b{display:inline-block;width:13px;height:13px;border-radius:50%;background:#ff7a1a;margin-right:12px;vertical-align:1px}
  #val{font-family:'Source Serif 4';font-weight:400;font-size:96px;line-height:1.02;margin-top:2px}
  #sub{font-family:'Inter';font-weight:500;font-size:22px;letter-spacing:.14em;opacity:.85;margin-top:12px}
  #cap{top:1250px;text-align:center;font-family:'Source Serif 4';font-style:italic;color:#fff;font-size:56px;font-weight:500;line-height:1.2;padding:0 170px;transform-origin:50% 30%;
    text-shadow:0 0 4px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.9),0 2px 24px rgba(0,0,0,.85),0 0 40px rgba(0,0,0,.6)}
  #cap b{font-weight:500;color:#ffb048}
  #end{top:0;bottom:0;background:#120e16;opacity:0}
  #endT{top:560px;text-align:center;font-family:'Source Serif 4';font-weight:400;color:#f2f0ea;font-size:68px;line-height:1.14;opacity:0;padding:0 110px}
  #endS{top:1010px;text-align:center;font-family:'Inter';font-weight:600;color:#e8dcc8;font-size:34px;letter-spacing:.06em;line-height:1.75;opacity:0;padding:0 150px}
  #endS i{font-style:normal;color:#ffb048}
  .pass-scene .txt{visibility:hidden!important}
  .pass-text canvas,.pass-text .gfx{visibility:hidden!important}
  html.pass-text,html.pass-text body,html.pass-text #wrap{background:transparent!important}
  .card{position:absolute;width:250px;background:rgba(10,14,22,.82);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .card img{width:250px;height:300px;object-fit:cover;object-position:50% 20%;border-radius:8px;display:block}
  .card .cn{font-family:'Source Serif 4';font-size:34px;color:#fff;margin-top:10px;line-height:1.1}
  .card .cr{font-family:'Inter';font-weight:600;font-size:16px;letter-spacing:.14em;color:#ffb048;margin-top:6px}
  .stk{position:absolute;transform:translate(-50%,-100%);font-family:'Inter';font-weight:700;font-size:30px;letter-spacing:.12em;color:#fff;padding:8px 18px;border-radius:6px;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.45)}
  .stk.b{background:linear-gradient(#3d7dff,#2a5ad8)} .stk.r{background:linear-gradient(#ff5a5a,#d83a3a)} .stk.g{background:#5a5f6a} .stk.sm{font-size:20px;padding:5px 12px}
  #cap .y{color:#ffd23a;font-style:normal;font-weight:600}
  #hemi{position:absolute;left:160px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="labels2"></div><div id="title" class="ov txt">The 2026 <span class="hl">midterms</span> in 60 seconds</div>
  <div id="hud" class="ov txt"><div id="stat"></div><div id="val"></div><div id="sub"></div></div>
  <div id="labels" class="ov txt" style="top:0;bottom:0"></div>
  <div id="cap" class="ov txt"></div>
  <div id="flash" class="ov gfx" style="top:0;bottom:0;background:#fff;opacity:0"></div>
  <div id="end" class="ov gfx"></div>
  <div id="endT" class="ov txt">The 2026 <span class="hl">midterms</span> in 60 seconds</div>
  <div id="endS" class="ov txt"></div></div>
</div>
<script>window.PASS=new URLSearchParams(location.search).get("pass")||"all"; document.documentElement.classList.add("pass-"+window.PASS);</script>

</body>
</html>
