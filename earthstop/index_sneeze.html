<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<style>
  /* text layer for the Blender sneeze short (rendered with PASS=text, composited over the Cycles frames) */
  html,body{margin:0;background:transparent;overflow:hidden} #wrap{position:relative;width:1080px;height:1920px}
  .ov{position:absolute;left:0;right:0;text-align:center;font-family:'Inter';pointer-events:none}
  #cap{top:1220px;padding:0 120px;font-weight:800;font-size:82px;line-height:1.08;color:#fff;letter-spacing:-.01em;
    -webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 6px 24px rgba(0,0,0,.55)}
  #cap .on{color:#ffd23a} #tag{top:380px;font-weight:600;font-size:34px;letter-spacing:.2em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.9);opacity:0}
  #big{top:520px;font-weight:800;font-size:220px;color:#ff4a3a;-webkit-text-stroke:12px #000;paint-order:stroke fill;opacity:0}
</style></head>
<body><div id="wrap"><div id="tag" class="ov"></div><div id="big" class="ov"></div><div id="cap" class="ov"></div></div>
<script>
window.PASS = 'text';
const $ = id => document.getElementById(id), clamp = (x, a, b) => Math.max(a, Math.min(b, x));
let TM;
window.sceneReady = (async () => { await document.fonts.ready; TM = await (await fetch('out/sneeze/timing.json')).json();
  // caption chunks: up to 3 words, a sentence end closes a chunk
  const W = TM.words.map(([t, w], i) => ({ t, w, end: i + 1 < TM.words.length ? TM.words[i + 1][0] : TM.t_end - 1.2 })); TM.chunks = []; let cur = [];
  W.forEach(x => { cur.push(x); if (cur.length === 3 || /[.,!?]$/.test(x.w)) { TM.chunks.push(cur); cur = []; } }); if (cur.length) TM.chunks.push(cur);
  return true; })();
const shot = (t, n) => TM.shots.find(s => s.name === n);
window.renderAt = t => {
  const ch = TM.chunks.find(c => t >= c[0].t - 0.02 && t < c[c.length - 1].end + 0.05);
  $('cap').innerHTML = ch ? ch.map(x => `<span class="${t >= x.t && t < x.end ? 'on' : ''}">${x.w.replace(/[.,]$/, '').toUpperCase()}</span>`).join(' ') : '';
  const k = ch ? clamp((t - ch[0].t) / 0.12, 0, 1) : 1; $('cap').style.transform = `scale(${0.85 + 0.15 * k})`;
  const tag = [['car', 'SCOTLAND · 2023'], ['rupture', 'ENGLAND · 2018'], ['hospital', 'DAY 7']].find(([n]) => { const s = shot(t, n); return t >= s.t0 && t < s.t1; });
  $('tag').textContent = tag ? tag[1] : ''; $('tag').style.opacity = tag ? 1 : 0;
  const p = shot(t, 'pressure'), on = t >= p.t0 + 1.2 && t < p.t1; $('big').textContent = '×20'; $('big').style.opacity = on ? 1 : 0;
  $('big').style.transform = `scale(${on ? 1 + 0.25 * Math.max(0, 1 - (t - p.t0 - 1.2) / 0.25) : 1})`;
  return true; };
</script></body></html>
