<style>

  .ov{position:absolute;left:0;right:0;pointer-events:none}

  /* TikTok safe zones: top < 320, right column x > 900 (y 950-1670), bottom > 1650, ~57px side crop */
  #title{top:345px;text-align:center;font-family:'Source Serif 4';font-weight:400;color:#fff;
    font-size:82px;line-height:1.12;padding:0 100px;text-shadow:0 2px 18px rgba(0,0,0,.6),0 0 3px rgba(0,0,0,.4)}

  #lab{font-family:'Inter';font-weight:600;font-size:27px;letter-spacing:.16em}

  #sub{font-family:'Inter';font-weight:500;font-size:22px;letter-spacing:.14em;opacity:.85;margin-top:14px;max-width:760px}

  #shade{top:0;bottom:0;background:radial-gradient(ellipse 70% 26% at 26% 52%,rgba(0,0,0,.26),transparent 70%),linear-gradient(to bottom,rgba(0,0,0,.22),transparent 16%,transparent 60%,rgba(0,0,0,.32));}
  #vig{top:0;bottom:0;background:radial-gradient(ellipse 85% 70% at 50% 50%,transparent 60%,rgba(0,0,0,.35))}
  #veil{top:0;bottom:0;background:#e8eef6;opacity:0}
  #flash{top:0;bottom:0;background:#ffffff;opacity:0}
  #cracks{top:0;bottom:0;opacity:0}
  #lead{top:0;opacity:0}
  #labels{top:0;bottom:0}
  .lbl{position:absolute;transform:translate(-50%,-50%);font-family:'Inter';font-weight:600;font-size:24px;letter-spacing:.16em;color:#fff;white-space:nowrap;
    text-shadow:0 1px 8px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.6)}
  .lbl.small{font-size:20px;letter-spacing:.14em;opacity:.9}
  .lbl.you{color:#9fd4ff;font-size:28px}
  .lbl.blue{color:#8cc4ff;font-size:21px}.lbl.orange{color:#ffb878;font-size:21px}
  .lbl.gas{color:#d8f57a}
  .lbl .big{font-family:'Source Serif 4';font-weight:400;font-size:44px;letter-spacing:0}
  .lbl.big{font-family:'Source Serif 4';font-weight:400;font-size:40px;letter-spacing:0}
  /* switch */
  #sw{top:560px;text-align:center;opacity:0;font-family:'Inter';color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.6)}
  #sw .t{font-weight:600;font-size:30px;letter-spacing:.2em;margin-bottom:22px}
  #sw .pill{display:inline-block;position:relative;width:250px;height:116px;border-radius:58px;background:#34c759;box-shadow:0 6px 30px rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,255,255,.25);transition:none}
  #sw .knob{position:absolute;top:8px;left:142px;width:100px;height:100px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.35)}
  #sw.off .pill{background:#ff3b30}
  #sw.off .knob{left:8px}
  #sw .st{font-weight:600;font-size:44px;letter-spacing:.12em;margin-top:18px}
  #sw .s{font-weight:500;font-size:20px;letter-spacing:.14em;opacity:.85;margin-top:8px}
  #end{top:0;bottom:0;background:#141414;opacity:0}
  #endT{top:740px;text-align:center;font-family:'Source Serif 4';font-weight:400;color:#f2f0ea;font-size:78px;line-height:1.12;opacity:0;padding:0 120px}
  #endS{top:1000px;text-align:center;font-family:'Inter';font-weight:500;color:#9a978f;font-size:22px;letter-spacing:.1em;line-height:1.9;opacity:0;padding:0 190px}
  .pass-scene .txt{visibility:hidden!important}
  .pass-text canvas,.pass-text .gfx{visibility:hidden!important}
  html.pass-text,html.pass-text body{background:transparent!important}

  <svg id="lead" class="ov txt" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
