<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4fb">
  <title>Вход — {{BRAND}}</title>
  <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="screen">
    <section class="card intro" style="margin-top:12vh">
      <div class="intro__icon">🔑</div>
      <h2 class="intro__title">Вход в {{BRAND}}</h2>
      <p class="intro__text">
        Войдите через Telegram — тем же аккаунтом, которым пользуетесь
        в боте. Баланс и задания общие.
      </p>

      <div id="widget" style="display:flex;justify-content:center"></div>

      <p id="hint" class="hint" style="margin-top:18px">
        Кнопка не появилась? Откройте приложение через бота — там вход
        не нужен.
      </p>
    </section>
  </main>

  <script>
    // Кнопку виджета вставляем скриптом: имя бота подставляет сервер.
    (function () {
      var bot = "{{BOT}}";
      var hint = document.getElementById('hint');
      if (!bot) {
        hint.textContent = 'Вход недоступен: не удалось определить бота. '
          + 'Откройте приложение через бота в Telegram.';
        return;
      }
      var script = document.createElement('script');
      script.src = 'https://telegram.org/js/telegram-widget.js?22';
      script.setAttribute('data-telegram-login', bot);
      script.setAttribute('data-size', 'large');
      script.setAttribute('data-radius', '14');
      script.setAttribute('data-userpic', 'false');
      script.setAttribute('data-auth-url', location.origin + '/login/callback');
      script.setAttribute('data-request-access', 'write');
      script.async = true;
      script.onerror = function () {
        hint.textContent = 'Telegram не отвечает. Проверьте соединение '
          + 'и обновите страницу.';
      };
      document.getElementById('widget').appendChild(script);
    })();
  </script>
</body>
</html>
