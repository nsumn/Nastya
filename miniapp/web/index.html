<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4fb">
  <title>VOXY — платформа заданий</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main id="screen" class="screen">
    <div class="boot">
      <div class="boot__spinner"></div>
      <p class="boot__text">Загружаем платформу…</p>
    </div>
  </main>

  <nav id="tabbar" class="tabbar" hidden>
    <button class="tab is-active" data-tab="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="8" height="8" rx="2.5"/>
        <rect x="13" y="3" width="8" height="8" rx="2.5"/>
        <rect x="3" y="13" width="8" height="8" rx="2.5"/>
        <rect x="13" y="13" width="8" height="8" rx="2.5"/>
      </svg>
      <span>Задания</span>
    </button>
    <button class="tab" data-tab="top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/>
        <path d="M7 6H4v1a4 4 0 0 0 3 3.9M17 6h3v1a4 4 0 0 1-3 3.9"/>
        <path d="M12 14v3M8.5 20h7l-.7-3h-5.6l-.7 3Z"/>
      </svg>
      <span>Топ</span>
    </button>
    <button class="tab" data-tab="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="9" r="3.4"/>
        <path d="M5 20a7 7 0 0 1 14 0"/>
        <circle cx="12" cy="12" r="9.2"/>
      </svg>
      <span>Профиль</span>
    </button>
  </nav>

  <div id="overlay" class="overlay" hidden></div>

  <script src="app.js"></script>
</body>
</html>
